# Builds the site and deploys it to Cloudflare Pages every time you push to "main".
# One-time setup: add two repository secrets in GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – a Cloudflare API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – your Cloudflare account ID
# See README.md, step 4, for click-by-click instructions.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: npm run build

      - name: Check for broken links
        run: node scripts/check-links.js

      - name: Read project name from site.config.js
        id: cfg
        run: echo "project=$(node -p "require('./site.config.js').cloudflareProject")" >> "$GITHUB_OUTPUT"

      - name: Explain missing secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::The site built fine, but it was NOT deployed because the CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing. See README.md step 4."

      - name: Create the Cloudflare Pages project (first run only)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages project create "${{ steps.cfg.outputs.project }}" --production-branch=main || echo "Project already exists – that's fine."

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name="${{ steps.cfg.outputs.project }}" --branch=main --commit-dirty=true
