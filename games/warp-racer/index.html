<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Warp Racer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #0009; font-size: 34px; font-weight: 900; padding: 20px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🌀 Warp Racer<small>Steer around the tunnel with ← → / A D, or hold the left/right side.<br>Avoid the red barriers, fly through 🔵 rings for a boost!<br>Press Space or tap to launch</small></div></div>
<script>
(() => {
  const FAR = 24;
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, F, ang, av, objs, speed, dist, score, state = "menu", last = 0, keys = {}, touchDir = 0, spawnZ, hue = 200, shake = 0, boostT = 0, best = 0, stars = [];
  try { best = +localStorage.getItem("warp-racer-best") || 0; } catch (e) {}
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; F = Math.min(W, H) * 0.42; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", resize); resize();
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  function start() { ang = 0; av = 0; objs = []; speed = 9; dist = 0; score = 0; spawnZ = 10; boostT = 0; stars = []; state = "play"; msg.hidden = true; }
  const norm = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
  function spawn(z) {
    const r = Math.random();
    if (r < 0.7) { const width = 0.7 + Math.random() * Math.min(2.6, 1 + dist / 600); objs.push({ z, kind: "wall", a: Math.random() * Math.PI * 2, w: width }); if (dist > 300 && Math.random() < 0.3) objs.push({ z, kind: "wall", a: Math.random() * Math.PI * 2, w: 0.6 }); }
    else objs.push({ z, kind: "ring", a: Math.random() * Math.PI * 2 });
  }
  function update(dt) {
    const dir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0) || touchDir;
    av += dir * 14 * dt; av *= Math.pow(0.02, dt); ang = norm(ang + av * dt);
    boostT = Math.max(0, boostT - dt);
    speed = Math.min(30, 9 + dist / 120) * (boostT > 0 ? 1.5 : 1);
    const dz = speed * dt; dist += dz; score += dz * (boostT > 0 ? 2 : 1); hue = (hue + dt * 10) % 360;
    spawnZ -= dz;
    while (spawnZ < FAR) { spawn(spawnZ); spawnZ += Math.max(2.2, 4.2 - dist / 500); }
    for (const o of objs) {
      const before = o.z; o.z -= dz;
      if (before > 1 && o.z <= 1) {
        const d = Math.abs(norm(o.a - ang));
        if (o.kind === "wall" && d < o.w / 2) { crash(); return; }
        if (o.kind === "ring" && d < 0.35) { o.got = true; boostT = 1.5; score += 50; for (let i = 0; i < 20; i++) stars.push({ a: Math.random() * 7, r: 0, v: 200 + Math.random() * 300, life: 0.6 }); }
      }
    }
    objs = objs.filter((o) => o.z > 0.3 && !o.got);
  }
  function crash() {
    state = "over"; shake = 20; const s = Math.floor(score);
    if (s > best) { best = s; try { localStorage.setItem("warp-racer-best", best); } catch (e) {} }
    setTimeout(() => show("💥 Crashed!", `Score: ${s} · Best: ${best}<br>Press Space or tap to warp again`), 600);
  }
  const P = (a, z) => { const r = F / z, sa = a - (ang || 0) + Math.PI / 2; return [W / 2 + Math.cos(sa) * r, H / 2 + Math.sin(sa) * r]; };
  function draw(dt) {
    x.save();
    if (shake > 0) { x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = Math.max(0, shake - dt * 30); }
    x.fillStyle = "#03010a"; x.fillRect(-30, -30, W + 60, H + 60);
    const d0 = dist || performance.now() / 300;
    // tunnel rings
    for (let k = 0; k < 26; k++) {
      const z = FAR - ((d0 * 1.0 + k * (FAR / 26)) % FAR) + 0.4; if (z < 0.5) continue;
      x.strokeStyle = `hsla(${(hue + z * 8) % 360},90%,60%,${Math.min(1, 2 / z) * 0.6})`; x.lineWidth = Math.max(1, 6 / z);
      x.beginPath(); x.arc(W / 2, H / 2, F / z, 0, 7); x.stroke();
    }
    // tunnel spokes
    for (let k = 0; k < 16; k++) { const a = (k / 16) * Math.PI * 2, [x1, y1] = P(a, FAR), [x2, y2] = P(a, 0.5); x.strokeStyle = `hsla(${hue},80%,60%,0.18)`; x.lineWidth = 1.5; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); }
    if (objs) for (const o of objs.slice().sort((p, q) => q.z - p.z)) {
      const fade = Math.min(1, (FAR - o.z) / 4);
      if (o.kind === "wall") {
        const r1 = F / o.z, r2 = F / (o.z + 0.4), sa = o.a - ang + Math.PI / 2;
        x.fillStyle = `rgba(255,70,100,${0.85 * fade})`; x.beginPath(); x.arc(W / 2, H / 2, r1, sa - o.w / 2, sa + o.w / 2); x.arc(W / 2, H / 2, r1 * 0.72, sa + o.w / 2, sa - o.w / 2, true); x.fill();
        x.strokeStyle = `rgba(255,200,210,${fade})`; x.lineWidth = Math.max(1, 4 / o.z); x.stroke();
      } else {
        const [px, py] = P(o.a, o.z), rr = F / o.z * 0.16;
        x.strokeStyle = `rgba(80,200,255,${fade})`; x.lineWidth = Math.max(2, 8 / o.z); x.beginPath(); x.arc(px, py, rr, 0, 7); x.stroke();
      }
    }
    for (const s of stars) { s.r += s.v * dt; s.life -= dt; x.globalAlpha = Math.max(0, s.life * 1.6); x.fillStyle = "#9be7ff"; x.beginPath(); x.arc(W / 2 + Math.cos(s.a) * s.r, H / 2 + F + Math.sin(s.a) * s.r * 0.4 - F * 0.1, 3, 0, 7); x.fill(); }
    x.globalAlpha = 1; stars = stars.filter((s) => s.life > 0);
    if (state !== "over" || shake > 10) {
      const px = W / 2, py = H / 2 + F * 0.9;
      x.save(); x.translate(px, py); x.rotate(-av * 0.05);
      x.fillStyle = boostT > 0 ? "#7cf7ff" : "#ff9f1c"; x.beginPath(); x.moveTo(-8, 10); x.lineTo(0, 22 + Math.random() * (boostT > 0 ? 26 : 12)); x.lineTo(8, 10); x.fill();
      x.fillStyle = "#e8ecff"; x.beginPath(); x.moveTo(0, -16); x.lineTo(26, 12); x.lineTo(0, 6); x.lineTo(-26, 12); x.closePath(); x.fill();
      x.fillStyle = "#7c5cff"; x.beginPath(); x.moveTo(0, -16); x.lineTo(6, 6); x.lineTo(-6, 6); x.fill();
      x.restore();
    }
    x.restore();
    if (objs && state !== "menu") {
      x.fillStyle = "#fff"; x.font = "900 24px system-ui"; x.textAlign = "center"; x.fillText(Math.floor(score), W / 2, 40);
      x.font = "700 14px system-ui"; x.fillText(`${Math.round(speed * 40)} km/s · 🏆 ${best}`, W / 2, 62);
      if (boostT > 0) { x.fillStyle = "#7cf7ff"; x.font = "900 20px system-ui"; x.fillText("BOOST!", W / 2, 90); }
    }
  }
  function loop(now) { const dt = Math.min(0.04, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt); draw(dt); requestAnimationFrame(loop); }
  const MAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (MAP[k]) { keys[MAP[k]] = true; e.preventDefault(); }
    if (k === " " || k === "enter") { e.preventDefault(); if (state === "menu" || (state === "over" && !msg.hidden)) start(); else if (state === "paused") { state = "play"; msg.hidden = true; } }
    if ((k === "p" || k === "escape") && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); }
  });
  addEventListener("keyup", (e) => { const k = MAP[e.key.toLowerCase()]; if (k) keys[k] = false; });
  addEventListener("pointerdown", (e) => { if (state === "menu" || (state === "over" && !msg.hidden)) return start(); if (state === "paused") { state = "play"; msg.hidden = true; return; } touchDir = e.clientX < W / 2 ? -1 : 1; });
  addEventListener("pointermove", (e) => { if (touchDir && e.buttons) touchDir = e.clientX < W / 2 ? -1 : 1; });
  addEventListener("pointerup", () => (touchDir = 0)); addEventListener("pointercancel", () => (touchDir = 0));
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); } });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
