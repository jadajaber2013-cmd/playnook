<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fruit Catcher</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe9ff; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #0005; font-size: 34px; font-weight: 900; padding: 20px; text-shadow: 0 3px 10px #0006; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🧺 Fruit Catcher<small>Catch the fruit, dodge the rotten ones 🤢<br>Arrow keys / A D, or drag your finger.<br>Press Space or tap to start</small></div></div>
<script>
(() => {
  const FRUITS = [["🍎", 10], ["🍌", 10], ["🍇", 15], ["🍓", 15], ["🍊", 10], ["🍉", 25], ["🍒", 20], ["🍍", 25]];
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, U, basket, items, fx, score, lives, combo, state = "menu", keys = {}, touchX = null, last = 0, t = 0, spawnT = 0, squash = 0, best = 0;
  try { best = +localStorage.getItem("fruit-catcher-best") || 0; } catch (e) {}
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; U = Math.min(W, H) / 600; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", resize); resize();
  function start() { basket = { x: W / 2, vx: 0 }; items = []; fx = []; score = 0; lives = 3; combo = 0; t = 0; state = "play"; msg.hidden = true; }
  function over() {
    state = "over";
    if (score > best) { best = score; try { localStorage.setItem("fruit-catcher-best", best); } catch (e) {} }
    show("🍂 Game over", `Score: ${score} · Best: ${best}<br>Press Space or tap to play again`);
  }
  function burst(px, py, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = 80 + Math.random() * 220; fx.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 150, life: 0.6, col }); } }

  function update(dt) {
    t += dt;
    const bw = 110 * U, ox = basket.x;
    if (keys.left) basket.x -= 620 * U * dt; if (keys.right) basket.x += 620 * U * dt;
    if (touchX !== null) basket.x += (touchX - basket.x) * Math.min(1, dt * 16);
    basket.x = Math.max(bw / 2, Math.min(W - bw / 2, basket.x));
    basket.vx = (basket.x - ox) / Math.max(dt, 0.001);
    spawnT -= dt;
    if (spawnT <= 0) {
      const rotten = Math.random() < Math.min(0.32, 0.12 + t / 300);
      const f = FRUITS[Math.floor(Math.random() * FRUITS.length)];
      items.push({ x: 30 * U + Math.random() * (W - 60 * U), y: -40 * U, vy: (150 + Math.random() * 80 + t * 4) * U, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 4, emoji: rotten ? "🤢" : f[0], pts: rotten ? 0 : f[1], rotten });
      spawnT = Math.max(0.3, 0.95 - t * 0.008);
    }
    const by = H - 70 * U;
    for (const it of items) {
      it.y += it.vy * dt; it.rot += it.vr * dt;
      if (!it.done && it.y > by - 30 * U && it.y < by + 10 * U && Math.abs(it.x - basket.x) < bw / 2) {
        it.done = true; squash = 1;
        if (it.rotten) { lives--; combo = 0; burst(it.x, by, "#7a8f3a", 14); fx.push({ text: "-❤️", x: it.x, y: by - 40 * U, life: 1 }); if (lives <= 0) return over(); }
        else { combo++; const p = it.pts * Math.min(1 + Math.floor(combo / 5), 5); score += p; burst(it.x, by, "#ffd23f", 10); fx.push({ text: `+${p}${combo >= 5 ? " 🔥x" + Math.min(1 + Math.floor(combo / 5), 5) : ""}`, x: it.x, y: by - 40 * U, life: 1 }); }
      } else if (!it.done && it.y > H + 40 * U) { it.done = true; if (!it.rotten) combo = 0; }
    }
    items = items.filter((it) => !it.done);
  }

  function draw(dt) {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#7fd0ff"); g.addColorStop(1, "#e6f7ff");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    // trees
    for (let i = 0; i < Math.ceil(W / (180 * U)) + 1; i++) {
      const tx = i * 180 * U + 40 * U;
      x.fillStyle = "#8b5a2b"; x.fillRect(tx - 8 * U, 50 * U, 16 * U, 60 * U);
      x.fillStyle = i % 2 ? "#3fae4a" : "#4cc95a"; x.beginPath(); x.arc(tx, 40 * U, 70 * U, 0, 7); x.arc(tx - 50 * U, 60 * U, 45 * U, 0, 7); x.arc(tx + 50 * U, 60 * U, 45 * U, 0, 7); x.fill();
    }
    x.fillStyle = "#6fcf5a"; x.fillRect(0, H - 40 * U, W, 40 * U);
    x.fillStyle = "#58b847"; for (let gx = 0; gx < W; gx += 14 * U) { x.beginPath(); x.moveTo(gx, H - 40 * U); x.lineTo(gx + 7 * U, H - 52 * U); x.lineTo(gx + 14 * U, H - 40 * U); x.fill(); }
    x.textAlign = "center"; x.textBaseline = "middle";
    if (items) for (const it of items) {
      x.save(); x.translate(it.x, it.y); x.rotate(it.rot); x.font = `${46 * U}px system-ui`;
      if (it.rotten) x.filter = "sepia(1) hue-rotate(40deg) saturate(1.4) brightness(.8)";
      x.fillText(it.rotten ? "🍎" : it.emoji, 0, 0); x.filter = "none";
      if (it.rotten) { x.fillStyle = "#5a3d1a"; x.beginPath(); x.arc(6 * U, -4 * U, 6 * U, 0, 7); x.arc(-8 * U, 8 * U, 4 * U, 0, 7); x.fill(); }
      x.restore();
    }
    if (basket) {
      squash = Math.max(0, squash - dt * 5);
      const bw = 110 * U, bh = 54 * U, by = H - 70 * U;
      x.save(); x.translate(basket.x, by + bh / 2); x.rotate(Math.max(-0.2, Math.min(0.2, basket.vx / (6000 * U)))); x.scale(1 + squash * 0.12, 1 - squash * 0.12);
      x.fillStyle = "#c98a46"; x.beginPath(); x.moveTo(-bw / 2, -bh / 2); x.lineTo(bw / 2, -bh / 2); x.lineTo(bw * 0.38, bh / 2); x.lineTo(-bw * 0.38, bh / 2); x.closePath(); x.fill();
      x.strokeStyle = "#9a6630"; x.lineWidth = 3 * U;
      for (let i = 1; i < 4; i++) { x.beginPath(); x.moveTo(-bw / 2 + i * bw / 4, -bh / 2); x.lineTo(-bw * 0.38 + i * bw * 0.19, bh / 2); x.stroke(); }
      x.beginPath(); x.moveTo(-bw * 0.45, 0); x.lineTo(bw * 0.45, 0); x.stroke();
      x.fillStyle = "#e0a35c"; x.beginPath(); x.roundRect(-bw / 2 - 4 * U, -bh / 2 - 6 * U, bw + 8 * U, 12 * U, 6 * U); x.fill();
      x.restore();
    }
    if (fx) {
      for (const f of fx) {
        f.life -= dt; x.globalAlpha = Math.max(0, Math.min(1, f.life * 2));
        if (f.text) { f.y -= 60 * dt; x.font = `900 ${26 * U}px system-ui`; x.lineWidth = 5; x.strokeStyle = "#0005"; x.strokeText(f.text, f.x, f.y); x.fillStyle = "#fff"; x.fillText(f.text, f.x, f.y); }
        else { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 700 * dt; x.fillStyle = f.col; x.beginPath(); x.arc(f.x, f.y, 4 * U, 0, 7); x.fill(); }
      }
      x.globalAlpha = 1; fx = fx.filter((f) => f.life > 0);
    }
    x.textBaseline = "alphabetic";
    if (state !== "menu") {
      x.fillStyle = "#fff"; x.strokeStyle = "#0004"; x.lineWidth = 5; x.font = `900 ${26 * U}px system-ui`;
      x.textAlign = "left"; x.strokeText(`⭐ ${score}`, 16, 40); x.fillText(`⭐ ${score}`, 16, 40);
      x.textAlign = "right"; x.fillText("❤️".repeat(Math.max(0, lives)) + "🤍".repeat(3 - Math.max(0, lives)), W - 16, 40);
    }
  }

  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt); draw(dt); requestAnimationFrame(loop); }
  const MAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (MAP[k]) { keys[MAP[k]] = true; touchX = null; e.preventDefault(); }
    if (k === " " || k === "enter") { e.preventDefault(); if (state === "menu" || state === "over") start(); else if (state === "paused") { state = "play"; msg.hidden = true; } }
    if ((k === "p" || k === "escape") && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); }
  });
  addEventListener("keyup", (e) => { const k = MAP[e.key.toLowerCase()]; if (k) keys[k] = false; });
  addEventListener("pointerdown", (e) => { if (state === "play") touchX = e.clientX; else if (state === "paused") { state = "play"; msg.hidden = true; } else start(); });
  addEventListener("pointermove", (e) => { if (state === "play" && (e.buttons || e.pointerType === "mouse")) touchX = e.clientX; });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); } });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
