<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d3b2e; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; box-sizing: border-box; }
  #hud { display: flex; gap: 18px; font-weight: 800; font-size: 18px; }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 30px #0006; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: #0009; border-radius: 12px; font-size: 24px; font-weight: 800; padding: 16px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 15px; font-weight: 500; opacity: .9; margin-top: 8px; }
  #pad { display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 50px); gap: 6px; }
  #pad button { border: 0; border-radius: 12px; background: #ffffff22; color: #fff; font-size: 22px; touch-action: none; }
  #pad button:active { background: #ffffff55; }
  @media (pointer: coarse) { #pad { display: grid; } }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="score">Score: 0</span><span id="best">Best: 0</span></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="msg"><div>🐍 Snake<small>Press Space or tap to start<br>Arrows / WASD or swipe to steer</small></div></div>
  </div>
  <div id="pad" aria-hidden="true">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
</div>
<script>
(() => {
  const N = 20; // grid size
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const msg = document.getElementById("msg"), scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
  const pad = document.getElementById("pad");
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  let cell, snake, dir, queue, food, score, best = +localStorage.getItem("snake-best") || 0, state = "ready", acc = 0, last = 0;
  bestEl.textContent = "Best: " + best;

  function resize() {
    const padH = getComputedStyle(pad).display === "none" ? 0 : 120;
    const size = Math.max(160, Math.min(innerWidth - 16, innerHeight - 60 - padH));
    cell = Math.floor(size / N);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.width = canvas.style.height = cell * N + "px";
    canvas.width = canvas.height = cell * N * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = "right"; queue = []; score = 0; acc = 0;
    placeFood();
    scoreEl.textContent = "Score: 0";
  }

  function start() { reset(); state = "play"; msg.hidden = true; }

  function turn(d) {
    if (state === "ready" || state === "over") { start(); }
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    const [ax, ay] = DIRS[lastDir], [bx, by] = DIRS[d];
    if (ax + bx === 0 && ay + by === 0) return; // can't reverse
    if (d !== lastDir && queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + DIRS[dir][0], y: snake[0].y + DIRS[dir][1] };
    const eating = head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some((s) => s.x === head.x && s.y === head.y)) return over();
    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = "Score: " + score;
      if (snake.length === N * N) return over(true);
      placeFood();
    } else snake.pop();
  }

  function over(won) {
    state = "over";
    if (score > best) { best = score; localStorage.setItem("snake-best", best); bestEl.textContent = "Best: " + best; }
    msg.innerHTML = `<div>${won ? "🏆 You filled the board!" : "Game over"}<small>Score: ${score} · Best: ${best}<br>Press Space or tap to play again</small></div>`;
    msg.hidden = false;
  }

  function pause() {
    if (state === "play") { state = "paused"; msg.innerHTML = "<div>Paused<small>Press P or tap to continue</small></div>"; msg.hidden = false; }
    else if (state === "paused") { state = "play"; msg.hidden = true; }
  }

  function draw() {
    if (!snake) return;
    const S = cell * N;
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      ctx.fillStyle = (x + y) % 2 ? "#1fa463" : "#22b06b";
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
    // food
    ctx.fillStyle = "#ff4d6d";
    ctx.beginPath(); ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2 + 1, cell * 0.38, 0, 7); ctx.fill();
    ctx.fillStyle = "#3d8b2f"; ctx.fillRect(food.x * cell + cell / 2 - 1, food.y * cell + 2, 3, cell * 0.25);
    // snake
    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = `hsl(${85 - t * 30}, 95%, ${62 - t * 18}%)`;
      ctx.beginPath(); ctx.roundRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2, cell * 0.3); ctx.fill();
    });
    const h = snake[0], [dx, dy] = DIRS[dir];
    ctx.fillStyle = "#111";
    for (const side of [-1, 1]) {
      const ex = h.x * cell + cell / 2 + dx * cell * 0.15 + dy * side * cell * 0.2;
      const ey = h.y * cell + cell / 2 + dy * cell * 0.15 + dx * side * cell * 0.2;
      ctx.beginPath(); ctx.arc(ex, ey, cell * 0.1, 0, 7); ctx.fill();
    }
  }

  function loop(t) {
    const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
    if (state === "play") {
      acc += dt;
      const interval = Math.max(0.06, 0.15 - score * 0.003);
      while (acc >= interval && state === "play") { acc -= interval; step(); }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // Keyboard
  const KEYMAP = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (KEYMAP[k]) { e.preventDefault(); if (state !== "paused") turn(KEYMAP[k]); }
    else if (k === " " || k === "enter") { e.preventDefault(); if (state === "paused") pause(); else if (state !== "play") start(); }
    else if (k === "p" || k === "escape") pause();
  });

  // Swipe
  let sx = null, sy = null;
  canvas.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
  canvas.addEventListener("pointermove", (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      sx = e.clientX; sy = e.clientY;
    }
  });
  addEventListener("pointerup", () => { sx = sy = null; });
  msg.addEventListener("pointerdown", (e) => { e.stopPropagation(); if (state === "paused") pause(); else if (state !== "play") start(); });

  // On-screen buttons
  pad.querySelectorAll("button").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); if (state === "paused") pause(); turn(b.dataset.d); }));

  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pause(); });
  addEventListener("resize", resize);
  reset(); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
