<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Number Merge</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #fff4e6; color: #5b3a1a; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; box-sizing: border-box; }
  #top { display: flex; gap: 8px; align-items: stretch; width: var(--w); }
  .box { flex: 1; background: #b4835a; color: #fff; border-radius: 10px; padding: 6px 10px; text-align: center; font-weight: 800; font-size: 20px; }
  .box small { display: block; font-size: 11px; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }
  #top button { border: 0; border-radius: 10px; background: #ff7a1a; color: #fff; font: inherit; font-weight: 800; padding: 0 14px; cursor: pointer; }
  #board { position: relative; width: var(--w); height: var(--w); background: #c9a27e; border-radius: 14px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--g); padding: var(--g); box-sizing: border-box; }
  .slot { background: #ffffff40; border-radius: 8px; }
  .tile { position: absolute; display: grid; place-items: center; border-radius: 8px; font-weight: 900; transition: left .1s, top .1s; }
  .tile.new { animation: pop .18s ease-out; }
  .tile.merged { animation: bump .18s ease-out; z-index: 2; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.15); } }
  #msg { position: absolute; inset: 0; background: #fff4e6dd; border-radius: 14px; display: grid; place-items: center; text-align: center; font-size: 26px; font-weight: 900; z-index: 5; }
  #msg[hidden] { display: none; }
  #msg button { margin: 6px; border: 0; border-radius: 999px; background: #ff7a1a; color: #fff; font: inherit; font-size: 16px; padding: 10px 18px; cursor: pointer; }
  #help { font-size: 13px; opacity: .75; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="box"><small>Score</small><span id="score">0</span></div>
    <div class="box"><small>Best</small><span id="best">0</span></div>
    <button type="button" id="new">New</button>
  </div>
  <div id="board"><div id="msg" hidden></div></div>
  <div id="help">Arrows / WASD or swipe to slide. Merge matching numbers!</div>
</div>
<script>
(() => {
  const N = 4;
  const COLORS = { 2: ["#fff3e0", "#6b3f12"], 4: ["#ffe0b2", "#6b3f12"], 8: ["#ffb74d", "#fff"], 16: ["#ff8a65", "#fff"], 32: ["#ff7043", "#fff"], 64: ["#f4511e", "#fff"], 128: ["#ffd54f", "#fff"], 256: ["#ffca28", "#fff"], 512: ["#ffc107", "#fff"], 1024: ["#26c6da", "#fff"], 2048: ["#7c5cff", "#fff"] };
  const boardEl = document.getElementById("board"), msg = document.getElementById("msg");
  const scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
  let grid, score, best = +localStorage.getItem("merge-best") || 0, won, keepGoing, idSeq = 0, W, G;
  bestEl.textContent = best;

  for (let i = 0; i < N * N; i++) { const s = document.createElement("div"); s.className = "slot"; boardEl.appendChild(s); }

  function layout() {
    W = Math.floor(Math.min(innerWidth - 24, innerHeight - 130, 520));
    G = Math.max(6, Math.round(W * 0.025));
    document.documentElement.style.setProperty("--w", W + "px");
    document.documentElement.style.setProperty("--g", G + "px");
    render();
  }

  function empty() { const out = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]); return out; }

  function addTile() {
    const e = empty();
    if (!e.length) return;
    const [r, c] = e[Math.floor(Math.random() * e.length)];
    grid[r][c] = { v: Math.random() < 0.9 ? 2 : 4, id: ++idSeq, isNew: true };
  }

  function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    score = 0; won = false; keepGoing = false;
    addTile(); addTile();
    msg.hidden = true;
    render();
  }

  // Slide everything in one direction. dr/dc = direction.
  function move(dir) {
    if (!msg.hidden) return;
    const [dr, dc] = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
    let moved = false;
    grid.forEach((row) => row.forEach((t) => { if (t) { t.isNew = false; t.merged = false; } }));
    const order = [...Array(N).keys()];
    const rows = dr === 1 ? order.slice().reverse() : order, cols = dc === 1 ? order.slice().reverse() : order;
    for (const r of rows) for (const c of cols) {
      const t = grid[r][c];
      if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tc < 0 || tr >= N || tc >= N) break;
        const other = grid[tr][tc];
        if (!other) { nr = tr; nc = tc; continue; }
        if (other.v === t.v && !other.merged) { nr = tr; nc = tc; }
        break;
      }
      if (nr === r && nc === c) continue;
      moved = true;
      grid[r][c] = null;
      const target = grid[nr][nc];
      if (target) {
        target.v *= 2; target.merged = true; score += target.v;
        if (target.v === 2048 && !won) won = true;
      } else grid[nr][nc] = t;
    }
    if (!moved) return;
    addTile();
    if (score > best) { best = score; localStorage.setItem("merge-best", best); }
    render();
    if (won && !keepGoing) show("🎉 2048!", true);
    else if (!canMove()) show("No more moves", false);
  }

  function canMove() {
    if (empty().length) return true;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = grid[r][c].v;
      if ((c < N - 1 && grid[r][c + 1].v === v) || (r < N - 1 && grid[r + 1][c].v === v)) return true;
    }
    return false;
  }

  function show(text, canContinue) {
    msg.innerHTML = `<div>${text}<br><span style="font-size:16px;font-weight:600">Score: ${score}</span><br>${canContinue ? '<button type="button" id="cont">Keep going</button>' : ""}<button type="button" id="again">New game</button></div>`;
    msg.hidden = false;
    document.getElementById("again").onclick = newGame;
    if (canContinue) document.getElementById("cont").onclick = () => { keepGoing = true; msg.hidden = true; };
  }

  function render() {
    if (!grid) return;
    scoreEl.textContent = score; bestEl.textContent = best;
    const cell = (W - G * (N + 1)) / N;
    const seen = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) continue;
      seen.add(String(t.id));
      let el = boardEl.querySelector(`[data-id="${t.id}"]`);
      if (!el) { el = document.createElement("div"); el.dataset.id = t.id; boardEl.appendChild(el); }
      const [bg, fg] = COLORS[t.v] || ["#3c2a5a", "#fff"];
      el.className = "tile" + (t.isNew ? " new" : "") + (t.merged ? " merged" : "");
      Object.assign(el.style, { width: cell + "px", height: cell + "px", left: G + c * (cell + G) + "px", top: G + r * (cell + G) + "px", background: bg, color: fg, fontSize: cell * (t.v >= 1000 ? 0.32 : t.v >= 100 ? 0.4 : 0.5) + "px" });
      el.textContent = t.v;
    }
    boardEl.querySelectorAll(".tile").forEach((el) => { if (!seen.has(el.dataset.id)) el.remove(); });
  }

  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  addEventListener("keydown", (e) => {
    const d = KEYS[e.key.toLowerCase()];
    if (d) { e.preventDefault(); move(d); }
    else if (e.key.toLowerCase() === "n") newGame();
  });

  let sx = null, sy = null;
  addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; sx = e.clientX; sy = e.clientY; });
  addEventListener("pointerup", (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = sy = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  document.getElementById("new").addEventListener("click", newGame);
  addEventListener("resize", layout);
  layout(); newGame();
})();
</script>
</body>
</html>
