<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shape Sorter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff0f6; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const SHAPES = ["circle", "square", "triangle", "star", "heart", "hexagon", "diamond", "moon"];
  const COLS = { circle: "#ff4f6d", square: "#4dabf7", triangle: "#51cf66", star: "#ffd23f", heart: "#ff8fc7", hexagon: "#b15cff", diamond: "#2ec4b6", moon: "#ff9f1c" };
  const c = document.getElementById("c"), x = c.getContext("2d");
  let W, H, S, level = 1, holes = [], pieces = [], drag = null, fx = [], t = 0, cur = 0, done = 0, banner = null;
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; S = Math.min(W, H) / 600; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); layout(); }
  let audio; function tone(f, d = 0.15) { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0.15, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d); } catch (e) {} }
  function path(kind, r) {
    x.beginPath();
    if (kind === "circle") x.arc(0, 0, r, 0, 7);
    else if (kind === "square") x.roundRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7, r * 0.15);
    else if (kind === "triangle") { x.moveTo(0, -r); x.lineTo(r * 0.95, r * 0.75); x.lineTo(-r * 0.95, r * 0.75); x.closePath(); }
    else if (kind === "star") { for (let i = 0; i < 10; i++) { const a = (Math.PI * i) / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } x.closePath(); }
    else if (kind === "heart") { x.moveTo(0, r * 0.85); x.bezierCurveTo(-r * 1.3, -r * 0.1, -r * 0.6, -r * 1.1, 0, -r * 0.45); x.bezierCurveTo(r * 0.6, -r * 1.1, r * 1.3, -r * 0.1, 0, r * 0.85); }
    else if (kind === "hexagon") { for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); } x.closePath(); }
    else if (kind === "diamond") { x.moveTo(0, -r); x.lineTo(r * 0.7, 0); x.lineTo(0, r); x.lineTo(-r * 0.7, 0); x.closePath(); }
    else if (kind === "moon") { x.arc(0, 0, r, 0.6, Math.PI * 2 - 0.6); x.arc(r * 0.55, 0, r * 0.7, Math.PI * 2 - 1.1, 1.1, true); x.closePath(); }
  }
  function setup() {
    const n = Math.min(SHAPES.length, 2 + level), kinds = SHAPES.slice().sort(() => Math.random() - 0.5).slice(0, n);
    holes = kinds.map((k) => ({ kind: k, filled: false }));
    pieces = kinds.slice().sort(() => Math.random() - 0.5).map((k) => ({ kind: k, x: 0, y: 0, hx: 0, hy: 0, placed: false, scale: 0, wig: 0 }));
    done = 0; cur = 0; layout();
    pieces.forEach((p) => { p.x = p.hx; p.y = p.hy + 300 * S; });
  }
  function layout() {
    if (!holes.length) return;
    const n = holes.length, cols = Math.min(n, W > H ? n : 3), rowsH = Math.ceil(n / cols);
    holes.forEach((h, i) => { h.x = W / 2 + ((i % cols) - (cols - 1) / 2) * 140 * S; h.y = 150 * S + Math.floor(i / cols) * 130 * S; });
    const pc = Math.min(n, W > H ? n : 4);
    pieces.forEach((p, i) => { p.hx = W / 2 + ((i % pc) - (pc - 1) / 2) * 130 * S; p.hy = H - 120 * S - Math.floor(i / pc) * 120 * S; if (!p.placed && p !== (drag && drag.p)) { p.x = p.hx; p.y = p.hy; } if (p.placed) { const h = holes.find((q) => q.kind === p.kind); p.x = h.x; p.y = h.y; } });
  }
  addEventListener("resize", resize); resize(); setup();
  function drop(p) {
    p.hold = false;
    const h = holes.find((q) => !q.filled && Math.hypot(q.x - p.x, q.y - p.y) < 70 * S);
    if (h && h.kind === p.kind) {
      h.filled = true; p.placed = true; p.x = h.x; p.y = h.y; p.scale = 0.6; done++; tone(520 + done * 80);
      for (let i = 0; i < 16; i++) { const a = Math.random() * 7; fx.push({ x: h.x, y: h.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, l: 0.7, col: COLS[p.kind] }); }
      if (done === holes.length) { banner = { t: ["🎉 Super!", "🌟 Amazing!", "👏 Well done!", "🥳 Hooray!"][level % 4], l: 2 }; [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.25), i * 120)); setTimeout(() => { level++; setup(); }, 1800); }
      else cur = pieces.findIndex((q) => !q.placed);
    } else { p.wig = 0.5; if (h) tone(180, 0.2); }
  }
  function draw(dt) {
    t += dt;
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#fff0f6"); g.addColorStop(1, "#e7f5ff"); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "#d9a066"; x.beginPath(); x.roundRect(W / 2 - Math.min(W * 0.46, holes.length * 72 * S + 40 * S), 70 * S, Math.min(W * 0.92, holes.length * 144 * S + 80 * S), (Math.ceil(holes.length / Math.min(holes.length, W > H ? holes.length : 3))) * 130 * S + 30 * S, 24 * S); x.fill();
    x.fillStyle = "#1c1638"; x.font = `900 ${26 * S}px system-ui`; x.textAlign = "center"; x.fillText(`Shape Sorter · Level ${level}`, W / 2, 46 * S);
    for (const h of holes) { x.save(); x.translate(h.x, h.y); x.fillStyle = "#6b4420"; path(h.kind, 44 * S); x.fill(); x.strokeStyle = "#ffffff55"; x.lineWidth = 3; x.setLineDash([6, 6]); x.stroke(); x.setLineDash([]); x.restore(); }
    pieces.forEach((p, i) => {
      if (!p.placed && !p.hold && p !== (drag && drag.p)) { p.x += (p.hx - p.x) * Math.min(1, dt * 8); p.y += (p.hy - p.y) * Math.min(1, dt * 8); }
      p.scale = Math.min(1, p.scale + dt * 3); p.wig = Math.max(0, p.wig - dt);
      const lift = p === (drag && drag.p) ? 1.12 : 1, bob = p.placed ? 0 : Math.sin(t * 2 + i) * 3 * S;
      x.save(); x.translate(p.x + Math.sin(p.wig * 40) * 10 * p.wig, p.y + bob); x.scale(p.scale * lift, p.scale * lift);
      x.fillStyle = "#0002"; x.save(); x.translate(4 * S, 6 * S); path(p.kind, 42 * S); x.fill(); x.restore();
      x.fillStyle = COLS[p.kind]; path(p.kind, 42 * S); x.fill(); x.strokeStyle = "#ffffff88"; x.lineWidth = 3; x.stroke();
      x.fillStyle = "#fff"; x.beginPath(); x.arc(-10 * S, -6 * S, 6 * S, 0, 7); x.arc(10 * S, -6 * S, 6 * S, 0, 7); x.fill();
      x.fillStyle = "#1c1638"; x.beginPath(); x.arc(-9 * S, -5 * S, 3 * S, 0, 7); x.arc(11 * S, -5 * S, 3 * S, 0, 7); x.fill();
      x.strokeStyle = "#1c1638"; x.lineWidth = 2; x.beginPath(); x.arc(0, 4 * S, 7 * S, 0.2, Math.PI - 0.2); x.stroke();
      if (kbd && i === cur && !p.placed) { x.strokeStyle = "#1c1638"; x.setLineDash([5, 5]); x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 54 * S, 0, 7); x.stroke(); x.setLineDash([]); }
      x.restore();
    });
    for (const f of fx) { f.l -= dt; f.x += f.vx * dt; f.y += f.vy * dt; x.globalAlpha = Math.max(0, f.l * 1.5); x.fillStyle = f.col; x.beginPath(); x.arc(f.x, f.y, 5 * S, 0, 7); x.fill(); }
    x.globalAlpha = 1; fx = fx.filter((f) => f.l > 0);
    if (banner) { banner.l -= dt; const s = 1 + Math.max(0, banner.l - 1.6) * 2; x.save(); x.translate(W / 2, H / 2); x.scale(s, s); x.font = `900 ${56 * S}px system-ui`; x.fillStyle = "#7c5cff"; x.strokeStyle = "#fff"; x.lineWidth = 8; x.strokeText(banner.t, 0, 0); x.fillText(banner.t, 0, 0); x.restore(); if (banner.l <= 0) banner = null; }
  }
  let last = 0, kbd = false; function loop(now) { const dt = Math.min(0.04, (now - last) / 1000 || 0); last = now; draw(dt); requestAnimationFrame(loop); }
  c.addEventListener("pointerdown", (e) => { kbd = false; for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i]; if (!p.placed && Math.hypot(e.clientX - p.x, e.clientY - p.y) < 55 * S) { drag = { p, dx: p.x - e.clientX, dy: p.y - e.clientY }; try { c.setPointerCapture(e.pointerId); } catch (er) {} tone(400, 0.05); return; } } });
  c.addEventListener("pointermove", (e) => { if (drag) { drag.p.x = e.clientX + drag.dx; drag.p.y = e.clientY + drag.dy; } });
  c.addEventListener("pointerup", () => { if (drag) { const p = drag.p; drag = null; drop(p); } });
  addEventListener("keydown", (e) => {
    const p = pieces[cur]; kbd = true;
    if (e.key === "Tab") { e.preventDefault(); const free = pieces.map((q, i) => (q.placed ? -1 : i)).filter((i) => i >= 0); if (free.length) cur = free[(free.indexOf(cur) + (e.shiftKey ? -1 : 1) + free.length) % free.length]; }
    if (!p || p.placed) return;
    const m = { arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0], arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1] }[e.key.toLowerCase()];
    if (m) { e.preventDefault(); // jump between holes for keyboard users
      const targets = [...holes.filter((h) => !h.filled).map((h) => [h.x, h.y]), [p.hx, p.hy]];
      let bestT = null, bd = Infinity; for (const [tx, ty] of targets) { const dx = tx - p.x, dy = ty - p.y; if (dx * m[0] + dy * m[1] <= 5) continue; const d = Math.hypot(dx, dy); if (d < bd) { bd = d; bestT = [tx, ty]; } }
      if (bestT) { drag = { p, dx: 0, dy: 0 }; p.x = bestT[0]; p.y = bestT[1]; drag = null; p.hold = true; }
    }
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); drop(p); }
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
