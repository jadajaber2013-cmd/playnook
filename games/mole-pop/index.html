<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mole Pop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7ccf5b; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #0006; font-size: 34px; font-weight: 900; padding: 20px; text-shadow: 0 3px 10px #0006; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🔨 Mole Pop<small>Bop the moles! Golden moles = 50 points.<br>Don't bop the hedgehogs 🦔<br>Tap, click or press 1–9. Press Space or tap to start</small></div></div>
<script>
(() => {
  const ROUND = 45;
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, holes = [], fx = [], score, timeLeft, combo, state = "menu", last = 0, spawnT = 0, best = 0, t = 0;
  try { best = +localStorage.getItem("mole-pop-best") || 0; } catch (e) {}
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    const size = Math.min(W * 0.92, (H - 90) * 0.95), cell = size / 3, ox = (W - size) / 2, oy = 80 + (H - 80 - size) / 2;
    holes = Array.from({ length: 9 }, (_, i) => Object.assign(holes[i] || { up: 0, target: 0, kind: null, life: 0, hit: 0 }, { cx: ox + (i % 3 + 0.5) * cell, cy: oy + (Math.floor(i / 3) + 0.62) * cell, r: cell * 0.36 }));
  }
  addEventListener("resize", resize); resize();

  function start() { score = 0; combo = 0; timeLeft = ROUND; fx = []; holes.forEach((h) => { h.up = 0; h.target = 0; h.kind = null; }); state = "play"; msg.hidden = true; }
  function end() {
    state = "over";
    if (score > best) { best = score; try { localStorage.setItem("mole-pop-best", best); } catch (e) {} }
    show("⏰ Time's up!", `Score: ${score} · Best: ${best}<br>Press Space or tap to play again`);
  }

  function popUp() {
    const free = holes.filter((h) => !h.kind);
    if (!free.length) return;
    const h = free[Math.floor(Math.random() * free.length)], r = Math.random();
    h.kind = r < 0.08 ? "gold" : r < 0.22 ? "hog" : "mole";
    h.target = 1; h.hit = 0;
    h.life = Math.max(0.55, 1.3 - (ROUND - timeLeft) * 0.017) * (h.kind === "gold" ? 0.7 : 1);
  }

  function bop(h) {
    if (state !== "play" || !h.kind || h.hit || h.up < 0.4) return;
    h.hit = 1; h.target = 0;
    let pts, col;
    if (h.kind === "hog") { pts = -20; combo = 0; col = "#ff5d73"; }
    else { combo++; pts = (h.kind === "gold" ? 50 : 10) + Math.min(combo - 1, 10) * 2; col = h.kind === "gold" ? "#ffd23f" : "#fff"; }
    score = Math.max(0, score + pts);
    fx.push({ type: "text", x: h.cx, y: h.cy - h.r * 1.2, text: (pts > 0 ? "+" : "") + pts + (combo > 2 && pts > 0 ? ` x${combo}` : ""), col, life: 0.9 });
    for (let i = 0; i < 12; i++) { const a = Math.random() * 7, s = 120 + Math.random() * 200; fx.push({ type: "star", x: h.cx, y: h.cy - h.r * 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, col: h.kind === "hog" ? "#ff8a9a" : "#ffd23f", life: 0.6 }); }
    fx.push({ type: "ring", x: h.cx, y: h.cy - h.r * 0.4, r: 10, life: 0.35 });
  }

  function update(dt) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; return end(); }
    spawnT -= dt;
    if (spawnT <= 0) { popUp(); if (Math.random() < 0.25 + (ROUND - timeLeft) / ROUND * 0.4) popUp(); spawnT = Math.max(0.35, 0.9 - (ROUND - timeLeft) * 0.012); }
    for (const h of holes) {
      if (h.kind && !h.hit) { h.life -= dt; if (h.life <= 0) { h.target = 0; if (h.kind !== "hog") combo = 0; } }
    }
  }

  function drawCritter(h) {
    const R = h.r, rise = h.up, y = h.cy + R * 0.2 - rise * R * 1.15;
    x.save();
    x.beginPath(); x.rect(h.cx - R * 1.3, h.cy - R * 2.6, R * 2.6, R * 2.6 + R * 0.25); x.clip();
    const body = h.kind === "gold" ? "#ffcc33" : h.kind === "hog" ? "#a0785a" : "#8d5b3c";
    if (h.kind === "hog") {
      x.fillStyle = "#5b4030";
      for (let i = -4; i <= 4; i++) { x.beginPath(); x.moveTo(h.cx + i * R * 0.16 - R * 0.12, y - R * 0.3); x.lineTo(h.cx + i * R * 0.2, y - R * 1.15 + Math.abs(i) * R * 0.08); x.lineTo(h.cx + i * R * 0.16 + R * 0.12, y - R * 0.3); x.fill(); }
    }
    x.fillStyle = body; x.beginPath(); x.ellipse(h.cx, y, R * 0.75, R * 0.95, 0, 0, 7); x.fill();
    x.fillStyle = h.kind === "hog" ? "#e8c9a8" : h.kind === "gold" ? "#fff0a8" : "#d9a77f"; x.beginPath(); x.ellipse(h.cx, y + R * 0.25, R * 0.45, R * 0.4, 0, 0, 7); x.fill();
    if (h.hit) {
      x.strokeStyle = "#222"; x.lineWidth = R * 0.08;
      for (const s of [-1, 1]) { x.beginPath(); x.moveTo(h.cx + s * R * 0.35 - R * 0.1, y - R * 0.35); x.lineTo(h.cx + s * R * 0.35 + R * 0.1, y - R * 0.15); x.moveTo(h.cx + s * R * 0.35 + R * 0.1, y - R * 0.35); x.lineTo(h.cx + s * R * 0.35 - R * 0.1, y - R * 0.15); x.stroke(); }
    } else {
      x.fillStyle = "#fff"; for (const s of [-1, 1]) { x.beginPath(); x.arc(h.cx + s * R * 0.3, y - R * 0.25, R * 0.16, 0, 7); x.fill(); }
      x.fillStyle = "#111"; for (const s of [-1, 1]) { x.beginPath(); x.arc(h.cx + s * R * 0.3, y - R * 0.22, R * 0.08, 0, 7); x.fill(); }
    }
    x.fillStyle = h.kind === "hog" ? "#222" : "#ff8fa3"; x.beginPath(); x.ellipse(h.cx, y + R * 0.05, R * 0.14, R * 0.1, 0, 0, 7); x.fill();
    if (h.kind !== "hog") { x.fillStyle = "#fff"; x.fillRect(h.cx - R * 0.1, y + R * 0.22, R * 0.09, R * 0.14); x.fillRect(h.cx + R * 0.01, y + R * 0.22, R * 0.09, R * 0.14); }
    if (h.kind === "gold") { x.fillStyle = "#fff"; x.globalAlpha = 0.5 + Math.sin(t * 10) * 0.4; x.beginPath(); x.arc(h.cx + R * 0.5, y - R * 0.7, R * 0.1, 0, 7); x.fill(); x.globalAlpha = 1; }
    x.restore();
  }

  function draw(dt) {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#9be27b"); g.addColorStop(1, "#5cb845");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "#ffffff18"; for (let i = 0; i < 40; i++) { const gx = (i * 137) % W, gy = (i * 89) % H; x.fillRect(gx, gy, 3, 10); }
    for (const h of holes) {
      h.up += (h.target - h.up) * Math.min(1, dt * (h.target ? 14 : 10));
      if (!h.target && h.up < 0.02) { h.kind = null; h.up = 0; }
      x.fillStyle = "#4a2f1d"; x.beginPath(); x.ellipse(h.cx, h.cy + h.r * 0.2, h.r * 1.05, h.r * 0.42, 0, 0, 7); x.fill();
      x.fillStyle = "#2b1a0f"; x.beginPath(); x.ellipse(h.cx, h.cy + h.r * 0.22, h.r * 0.88, h.r * 0.3, 0, 0, 7); x.fill();
      if (h.kind) drawCritter(h);
      x.fillStyle = "#6b4a2f"; x.beginPath(); x.ellipse(h.cx, h.cy + h.r * 0.35, h.r * 1.05, h.r * 0.2, 0, 0, Math.PI); x.fill();
      x.fillStyle = "#ffffff55"; x.font = `800 ${h.r * 0.3}px system-ui`; x.textAlign = "center"; x.fillText(holes.indexOf(h) + 1, h.cx - h.r * 0.9, h.cy + h.r * 0.75);
    }
    for (const f of fx) {
      f.life -= dt; x.globalAlpha = Math.max(0, Math.min(1, f.life * 2.5));
      if (f.type === "text") { f.y -= 50 * dt; x.font = "900 30px system-ui"; x.textAlign = "center"; x.lineWidth = 6; x.strokeStyle = "#0006"; x.strokeText(f.text, f.x, f.y); x.fillStyle = f.col; x.fillText(f.text, f.x, f.y); }
      else if (f.type === "star") { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 600 * dt; x.fillStyle = f.col; x.beginPath(); x.arc(f.x, f.y, 4, 0, 7); x.fill(); }
      else { f.r += 300 * dt; x.strokeStyle = "#fff"; x.lineWidth = 4; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.stroke(); }
    }
    x.globalAlpha = 1; fx = fx.filter((f) => f.life > 0);
    // HUD
    x.fillStyle = "#00000033"; x.beginPath(); x.roundRect(12, 12, W - 24, 52, 26); x.fill();
    x.fillStyle = "#fff"; x.font = "900 22px system-ui"; x.textAlign = "left"; x.fillText(`⭐ ${score ?? 0}`, 30, 46);
    x.textAlign = "right"; x.fillText(`🏆 ${best}`, W - 30, 46);
    const tl = timeLeft ?? ROUND, bw = Math.min(260, W * 0.35);
    x.fillStyle = "#00000044"; x.beginPath(); x.roundRect(W / 2 - bw / 2, 30, bw, 16, 8); x.fill();
    x.fillStyle = tl < 10 ? "#ff5d73" : "#ffd23f"; x.beginPath(); x.roundRect(W / 2 - bw / 2, 30, bw * tl / ROUND, 16, 8); x.fill();
  }

  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; t += dt; if (state === "play") update(dt); draw(dt); requestAnimationFrame(loop); }
  c.addEventListener("pointerdown", (e) => {
    if (state !== "play") return;
    const h = holes.find((h) => h.kind && Math.abs(e.clientX - h.cx) < h.r * 1.05 && e.clientY < h.cy + h.r * 0.5 && e.clientY > h.cy - h.r * 2.2);
    if (h) bop(h);
  });
  msg.addEventListener("pointerdown", () => { if (state === "paused") { state = "play"; msg.hidden = true; } else start(); });
  addEventListener("keydown", (e) => {
    if (/^[1-9]$/.test(e.key)) bop(holes[+e.key - 1]);
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (state === "menu" || state === "over") start(); else if (state === "paused") { state = "play"; msg.hidden = true; } }
    if ((e.key === "p" || e.key === "Escape") && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); } });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
