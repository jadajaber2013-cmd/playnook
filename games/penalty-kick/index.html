<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Penalty Kick</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b8a3e; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #0008; font-size: 34px; font-weight: 900; padding: 20px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>⚽ Penalty Kick<small>Shooting: tap/click the goal to aim (or arrows), then tap/Space to stop the power bar.<br>Saving: tap the left, middle or right of the goal (or ← ↓ →) to dive.<br>5 kicks each. Press Space or tap to start</small></div></div>
<script>
(() => {
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, gx, gy, gw, gh, state = "menu", phase, round, you, cpu, hist, aim, power, pDir, ball, keeper, res, timer, t = 0, last = 0, confetti = [], shooting, dive, cpuShot;
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); gw = Math.min(W * 0.86, 620); gh = gw * 0.34; gx = (W - gw) / 2; gy = H * 0.24; }
  addEventListener("resize", resize); resize();
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  const G = (u, v) => [W / 2 + u * gw / 2, gy + gh - v * gh]; // goal coords: u -1..1, v 0..1
  function start() { you = 0; cpu = 0; hist = { you: [], cpu: [] }; shooting = true; state = "play"; msg.hidden = true; newKick(); }
  function newKick() {
    aim = { u: 0, v: 0.5 }; power = 0; pDir = 1; res = null; keeper = { u: 0, v: 0, tu: 0, tv: 0, lean: 0 }; dive = null;
    ball = { u: 0, v: 0, s: 0, fly: 0, from: [W / 2, H * 0.84], to: null };
    phase = shooting ? "aim" : "runup"; timer = shooting ? 0 : 1.3;
    if (!shooting) cpuShot = { u: (Math.random() * 2 - 1) * 0.85, v: 0.12 + Math.random() * 0.75, miss: Math.random() < 0.12 };
  }
  function shoot() {
    const p = power, over = p > 0.92, weak = p < 0.3;
    const tu = aim.u + (Math.random() - 0.5) * 0.12, tv = over ? 1.15 + (p - 0.92) * 4 : aim.v + (Math.random() - 0.5) * 0.1;
    ball.to = { u: tu, v: tv }; ball.fly = 0; ball.dur = 0.75 - p * 0.35; phase = "flight";
    const guess = Math.random() < 0.38 ? tu + (Math.random() - 0.5) * 0.3 : (Math.random() * 2 - 1) * 0.8;
    keeper.tu = Math.max(-0.85, Math.min(0.85, guess)); keeper.tv = Math.random() * 0.6; keeper.reach = weak ? 0.45 : 0.27;
  }
  function cpuKick() {
    const tu = cpuShot.miss ? (Math.random() < 0.5 ? -1.15 : 1.15) : cpuShot.u, tv = cpuShot.miss ? cpuShot.v : cpuShot.v;
    ball.to = { u: tu, v: tv }; ball.fly = 0; ball.dur = 0.65; phase = "flight";
  }
  function decide() {
    const b = ball.to; let goal;
    if (Math.abs(b.u) > 1 || b.v > 1) goal = false, res = shooting ? "Missed! 😬" : "Wide! 🙌";
    else if (shooting) { const saved = Math.abs(b.u - keeper.tu) < keeper.reach && Math.abs(b.v - keeper.tv) < 0.75; goal = !saved; res = saved ? "Saved! 🧤" : "GOAL! ⚽"; }
    else { const zone = b.u < -0.3 ? -1 : b.u > 0.3 ? 1 : 0, saved = dive !== null && dive === zone; goal = !saved; res = saved ? "You saved it! 🧤" : "Goal for CPU"; }
    if (shooting) { hist.you.push(goal); if (goal) { you++; burst(); } } else { hist.cpu.push(goal); if (goal) cpu++; else burst(); }
    phase = "result"; timer = 1.4;
  }
  function next() {
    shooting = !shooting;
    const ny = hist.you.length, nc = hist.cpu.length;
    // over early when one side can no longer catch up; after 5 each it's sudden death
    const over = ny < 5 || nc < 5 ? you > cpu + Math.max(0, 5 - nc) || cpu > you + Math.max(0, 5 - ny) : ny === nc && you !== cpu;
    if (over) {
      state = "over";
      return show(you > cpu ? "🏆 You win the shoot-out!" : "😢 CPU wins", `${you} – ${cpu}${ny > 5 ? " (sudden death)" : ""}<br>Press Space or tap to play again`);
    }
    newKick();
  }
  function burst() { for (let i = 0; i < 60; i++) confetti.push({ x: W / 2, y: gy + gh / 2, vx: (Math.random() - 0.5) * 700, vy: -Math.random() * 600, col: `hsl(${Math.random() * 360},90%,60%)`, life: 1.6, r: Math.random() * 6 }); }
  function update(dt) {
    t += dt;
    if (phase === "power") { power += pDir * dt * 1.4; if (power > 1) { power = 1; pDir = -1; } if (power < 0) { power = 0; pDir = 1; } }
    if (phase === "runup") { timer -= dt; if (timer <= 0) cpuKick(); }
    if (phase === "flight") {
      ball.fly += dt / ball.dur; const k = Math.min(1, ball.fly);
      if (shooting) { keeper.u += (keeper.tu - keeper.u) * Math.min(1, dt * 7); keeper.v += (keeper.tv - keeper.v) * Math.min(1, dt * 7); }
      else if (dive !== null) { keeper.u += (dive * 0.65 - keeper.u) * Math.min(1, dt * 9); keeper.v += (0.35 - keeper.v) * Math.min(1, dt * 9); }
      if (k >= 1) decide();
    }
    if (phase === "result") { timer -= dt; if (timer <= 0) next(); }
  }
  function draw(dt) {
    x.fillStyle = "#1e6b2f"; x.fillRect(0, 0, W, H);
    const sky = x.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, "#1c3a6e"); sky.addColorStop(1, "#4a7fc0"); x.fillStyle = sky; x.fillRect(0, 0, W, gy + gh * 0.2);
    for (let i = 0; i < 80; i++) { x.fillStyle = `hsl(${(i * 47) % 360},60%,${45 + (i % 3) * 10}%)`; x.beginPath(); x.arc((i * 37) % W, gy * 0.5 + ((i * 13) % 30) - Math.abs(Math.sin(t * 6 + i)) * (phase === "result" ? 6 : 1), 6, 0, 7); x.fill(); }
    x.fillStyle = "#2b8a3e"; x.fillRect(0, gy + gh * 0.2, W, H);
    for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? "#2f9e44" : "#2b8a3e"; const y0 = gy + gh + i * (H - gy - gh) / 8; x.fillRect(0, y0, W, (H - gy - gh) / 8); }
    x.strokeStyle = "#ffffffcc"; x.lineWidth = 3; x.beginPath(); x.moveTo(gx - gw * 0.3, gy + gh + 2); x.lineTo(gx + gw * 1.3, gy + gh + 2); x.moveTo(gx - gw * 0.15, gy + gh); x.lineTo(gx - gw * 0.3, H * 0.62); x.lineTo(gx + gw * 1.3, H * 0.62); x.lineTo(gx + gw * 1.15, gy + gh); x.stroke();
    x.fillStyle = "#fff"; x.beginPath(); x.ellipse(W / 2, H * 0.84 + 12, 8, 4, 0, 0, 7); x.fill();
    // net
    x.fillStyle = "#ffffff18"; x.fillRect(gx, gy, gw, gh);
    x.strokeStyle = "#ffffff40"; x.lineWidth = 1; for (let i = 0; i <= 24; i++) { x.beginPath(); x.moveTo(gx + i * gw / 24, gy); x.lineTo(gx + i * gw / 24, gy + gh); x.stroke(); } for (let j = 0; j <= 8; j++) { x.beginPath(); x.moveTo(gx, gy + j * gh / 8); x.lineTo(gx + gw, gy + j * gh / 8); x.stroke(); }
    x.strokeStyle = "#fff"; x.lineWidth = 8; x.lineJoin = "round"; x.beginPath(); x.moveTo(gx, gy + gh); x.lineTo(gx, gy); x.lineTo(gx + gw, gy); x.lineTo(gx + gw, gy + gh); x.stroke();
    if (state === "menu") return;
    // keeper
    const [kx, ky] = G(keeper.u, keeper.v), ks = gh / 140, tilt = keeper.u * 1.2;
    x.save(); x.translate(kx, gy + gh - keeper.v * gh * 0.6); x.rotate(tilt); x.scale(ks, ks);
    x.fillStyle = shooting ? "#ffd23f" : "#4dabf7"; x.beginPath(); x.roundRect(-16, -78, 32, 44, 10); x.fill();
    x.strokeStyle = shooting ? "#ffd23f" : "#4dabf7"; x.lineWidth = 10; x.lineCap = "round"; x.beginPath(); x.moveTo(-14, -70); x.lineTo(-42, -96 + Math.sin(t * 6) * 4); x.moveTo(14, -70); x.lineTo(42, -96 - Math.sin(t * 6) * 4); x.stroke();
    x.fillStyle = "#fff"; x.beginPath(); x.arc(-44, -98, 9, 0, 7); x.arc(44, -98, 9, 0, 7); x.fill();
    x.strokeStyle = "#222"; x.beginPath(); x.moveTo(-8, -36); x.lineTo(-12, 0); x.moveTo(8, -36); x.lineTo(12, 0); x.stroke();
    x.fillStyle = "#c68a5a"; x.beginPath(); x.arc(0, -92, 13, 0, 7); x.fill();
    x.restore();
    // aim + power
    if (shooting && (phase === "aim" || phase === "power")) {
      const [ax, ay] = G(aim.u, aim.v), r = 18 + Math.sin(t * 6) * 3;
      x.strokeStyle = "#ff4f7b"; x.lineWidth = 4; x.beginPath(); x.arc(ax, ay, r, 0, 7); x.moveTo(ax - r - 8, ay); x.lineTo(ax + r + 8, ay); x.moveTo(ax, ay - r - 8); x.lineTo(ax, ay + r + 8); x.stroke();
      const bw = Math.min(W * 0.7, 360), bx = (W - bw) / 2, by = H * 0.93;
      x.fillStyle = "#0006"; x.beginPath(); x.roundRect(bx - 4, by - 4, bw + 8, 24, 12); x.fill();
      const grd = x.createLinearGradient(bx, 0, bx + bw, 0); grd.addColorStop(0, "#51cf66"); grd.addColorStop(0.75, "#ffd23f"); grd.addColorStop(0.92, "#ff9f1c"); grd.addColorStop(1, "#e03131");
      x.fillStyle = grd; x.beginPath(); x.roundRect(bx, by, bw * (phase === "power" ? power : 0), 16, 8); x.fill();
      x.fillStyle = "#fff"; x.font = "800 14px system-ui"; x.textAlign = "center"; x.fillText(phase === "aim" ? "Tap the goal to aim · then tap again for power" : "Tap / Space to shoot!", W / 2, by - 12);
    }
    if (!shooting && phase === "runup") { x.fillStyle = "#fff"; x.font = `900 ${Math.min(30, W / 16)}px system-ui`; x.textAlign = "center"; x.fillText("Get ready to dive! ← ↓ →", W / 2, H * 0.72); }
    // ball
    let bxp = ball.from[0], byp = ball.from[1], br = Math.min(28, gh * 0.16);
    if (ball.to) { const k = Math.min(1, ball.fly), [tx, ty] = G(ball.to.u, ball.to.v), arc = Math.sin(k * Math.PI) * gh * 0.4; bxp = ball.from[0] + (tx - ball.from[0]) * k; byp = ball.from[1] + (ty - ball.from[1]) * k - arc; br *= 1 - k * 0.6; }
    x.save(); x.translate(bxp, byp); x.rotate(ball.fly * 12);
    x.fillStyle = "#fff"; x.beginPath(); x.arc(0, 0, br, 0, 7); x.fill();
    x.fillStyle = "#222"; x.beginPath(); for (let i = 0; i < 5; i++) { const a = i * 1.2566; x.lineTo(Math.cos(a) * br * 0.4, Math.sin(a) * br * 0.4); } x.fill();
    for (let i = 0; i < 5; i++) { const a = i * 1.2566 + 0.63; x.beginPath(); x.arc(Math.cos(a) * br * 0.85, Math.sin(a) * br * 0.85, br * 0.2, 0, 7); x.fill(); }
    x.restore();
    // scoreboard
    const dots = (arr) => [0, 1, 2, 3, 4].map((i) => (arr[i] === undefined ? "⚪" : arr[i] ? "🟢" : "🔴")).join("");
    x.fillStyle = "#000a"; x.beginPath(); x.roundRect(W / 2 - 150, 10, 300, 58, 14); x.fill();
    x.fillStyle = "#fff"; x.font = "800 15px system-ui"; x.textAlign = "left"; x.fillText(`YOU ${you}  ${dots(hist.you.slice(-5))}`, W / 2 - 136, 34); x.fillText(`CPU ${cpu}  ${dots(hist.cpu.slice(-5))}`, W / 2 - 136, 56);
    if (phase === "result") { x.font = `900 ${Math.min(56, W / 9)}px system-ui`; x.textAlign = "center"; x.strokeStyle = "#0008"; x.lineWidth = 8; x.strokeText(res, W / 2, H * 0.66); x.fillStyle = res.startsWith("GOAL") || res.startsWith("You saved") || res.startsWith("Wide") ? "#ffd23f" : "#fff"; x.fillText(res, W / 2, H * 0.66); }
    for (const p of confetti) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; x.fillStyle = p.col; x.fillRect(p.x, p.y, 4 + p.r, 8); }
    confetti = confetti.filter((p) => p.life > 0);
  }
  function loop(now) { const dt = Math.min(0.04, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt); draw(dt); requestAnimationFrame(loop); }
  function act(px, py) {
    if (state !== "play") return start();
    if (shooting && phase === "aim") { if (px !== undefined) { aim.u = Math.max(-0.95, Math.min(0.95, (px - W / 2) / (gw / 2))); aim.v = Math.max(0.05, Math.min(0.95, (gy + gh - py) / gh)); } phase = "power"; power = 0; pDir = 1; }
    else if (shooting && phase === "power") shoot();
    else if (!shooting && (phase === "runup" || phase === "flight") && dive === null) { dive = px === undefined ? 0 : px < W / 2 - gw / 6 ? -1 : px > W / 2 + gw / 6 ? 1 : 0; }
  }
  addEventListener("pointerdown", (e) => {
    if (state === "play" && shooting && phase === "aim" && (e.clientY > gy + gh + 40 || e.clientY < gy - 60)) { act(); return; }
    act(e.clientX, e.clientY);
  });
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
    if (state !== "play") { if (k === " " || k === "enter") start(); return; }
    if (shooting && phase === "aim") {
      if (k === "arrowleft" || k === "a") aim.u = Math.max(-0.95, aim.u - 0.15); if (k === "arrowright" || k === "d") aim.u = Math.min(0.95, aim.u + 0.15);
      if (k === "arrowup" || k === "w") aim.v = Math.min(0.95, aim.v + 0.15); if (k === "arrowdown" || k === "s") aim.v = Math.max(0.05, aim.v - 0.15);
      if (k === " " || k === "enter") act();
    } else if (shooting && phase === "power" && (k === " " || k === "enter")) act();
    else if (!shooting && dive === null && (phase === "runup" || phase === "flight")) { if (k === "arrowleft" || k === "a") dive = -1; if (k === "arrowright" || k === "d") dive = 1; if (k === "arrowdown" || k === "s" || k === "arrowup" || k === " ") dive = 0; }
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
