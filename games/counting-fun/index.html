<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Counting Fun</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: linear-gradient(160deg, #d3f9d8, #fff3bf); color: #1c1638; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 10px; box-sizing: border-box; text-align: center; }
  #top { display: flex; gap: 8px; font-weight: 900; font-size: 18px; }
  #top span { background: #fff; padding: 6px 14px; border-radius: 999px; box-shadow: 0 3px 0 #0001; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); }
  #field { position: relative; width: min(92vw, 640px); height: min(42vh, 360px); background: #fff; border-radius: 28px; box-shadow: 0 10px 30px #2b8a3e22, inset 0 0 0 4px #b2f2bb; overflow: hidden; }
  .critter { position: absolute; font-size: var(--s); line-height: 1; transform: translate(-50%, -50%); animation: hop .5s cubic-bezier(.34,1.56,.64,1) both, bob 2s ease-in-out infinite; animation-delay: var(--d), calc(var(--d) + .5s); cursor: pointer; }
  .critter.counted::after { content: attr(data-n); position: absolute; top: -6px; right: -10px; font-size: 16px; font-weight: 900; background: #7c5cff; color: #fff; border-radius: 999px; padding: 1px 7px; }
  @keyframes hop { from { transform: translate(-50%, 40%) scale(0); } }
  @keyframes bob { 50% { margin-top: -6px; } }
  #answers { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #answers button { width: 74px; height: 74px; border-radius: 22px; border: 0; background: #fff; font: 900 34px system-ui; color: #1c1638; cursor: pointer; box-shadow: 0 6px 0 #ced4da; transition: transform .15s cubic-bezier(.34,1.56,.64,1); }
  #answers button:hover { transform: translateY(-4px); }
  #answers button.right { background: #51cf66; color: #fff; box-shadow: 0 6px 0 #2b8a3e; animation: jump .5s; }
  #answers button.wrong { background: #ff8787; color: #fff; box-shadow: 0 6px 0 #c92a2a; animation: shake .4s; }
  @keyframes jump { 50% { transform: translateY(-16px) scale(1.1); } }
  @keyframes shake { 25%, 75% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }
  #tip { font-size: 14px; opacity: .7; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="stars">⭐ 0</span><span id="lvl">Up to 5</span></div>
  <h1 id="q">How many?</h1>
  <div id="field"></div>
  <div id="answers"></div>
  <div id="tip">Tap the animals to count them out loud · Pick the right number (or type it)</div>
</div>
<script>
(() => {
  const ANIMALS = ["🐶", "🐱", "🐰", "🐸", "🐥", "🐷", "🐻", "🦊", "🐼", "🐢", "🐞", "🐠", "🦄", "🐝", "🦋"];
  const field = document.getElementById("field"), ans = document.getElementById("answers");
  let stars = 0, max = 5, count, animal, tapped, lock = false;
  try { stars = +localStorage.getItem("counting-fun-stars") || 0; } catch (e) {}
  max = Math.min(20, 5 + Math.floor(stars / 5) * 3);
  function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 1; u.pitch = 1.3; speechSynthesis.speak(u); } catch (e) {} }
  let audio; function tone(f, d = 0.15) { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.15, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d); } catch (e) {} }
  function round() {
    lock = false; tapped = 0;
    count = 1 + Math.floor(Math.random() * max); animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    document.getElementById("q").textContent = `How many ${animal} can you count?`;
    document.getElementById("lvl").textContent = "Up to " + max;
    document.getElementById("stars").textContent = "⭐ " + stars;
    field.innerHTML = "";
    const fw = field.clientWidth, fh = field.clientHeight, size = Math.max(30, Math.min(64, Math.sqrt(fw * fh / (count * 2.6))));
    const spots = [];
    for (let i = 0; i < count; i++) {
      let px, py, tries = 0;
      do { px = size / 2 + 10 + Math.random() * (fw - size - 20); py = size / 2 + 10 + Math.random() * (fh - size - 20); tries++; } while (tries < 200 && spots.some(([a, b]) => Math.hypot(a - px, b - py) < size * 1.05));
      spots.push([px, py]);
      const d = document.createElement("span"); d.className = "critter"; d.textContent = animal;
      d.style.cssText = `left:${px}px;top:${py}px;--s:${size}px;--d:${i * 60}ms`;
      d.addEventListener("pointerdown", () => { if (d.classList.contains("counted") || lock) return; tapped++; d.dataset.n = tapped; d.classList.add("counted"); tone(400 + tapped * 40, 0.1); say(String(tapped)); });
      field.appendChild(d);
    }
    const opts = new Set([count]);
    while (opts.size < 4) { const o = count + Math.floor(Math.random() * 7) - 3; if (o >= 1 && o <= Math.max(max, 4)) opts.add(o); }
    ans.innerHTML = "";
    [...opts].sort((a, b) => a - b).forEach((n) => { const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.onclick = () => pick(n, b); ans.appendChild(b); });
  }
  function pick(n, b) {
    if (lock) return;
    if (n === count) {
      lock = true; b.classList.add("right"); stars++; try { localStorage.setItem("counting-fun-stars", stars); } catch (e) {}
      [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.2), i * 110)); say(`Yes! ${count}!`);
      document.getElementById("stars").textContent = "⭐ " + stars;
      if (stars % 5 === 0) max = Math.min(20, max + 3);
      setTimeout(round, 1500);
    } else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); tone(160, 0.25); say("Try again!"); }
  }
  let typed = "", typeT;
  addEventListener("keydown", (e) => {
    if (!/^[0-9]$/.test(e.key)) return;
    typed += e.key; clearTimeout(typeT);
    typeT = setTimeout(() => { const n = +typed; typed = ""; const b = [...ans.children].find((x) => +x.textContent === n); if (b) pick(n, b); }, max >= 10 ? 600 : 0);
  });
  round();
})();
</script>
</body>
</html>
