<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Flood</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #15122b; color: #fff; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8px; box-sizing: border-box; }
  #hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-weight: 800; }
  #hud span, #hud button { background: #ffffff18; border: 0; color: #fff; font: inherit; font-weight: 800; padding: 8px 14px; border-radius: 999px; }
  #hud button { cursor: pointer; } #hud button.on { background: #ffd23f; color: #3a2400; }
  #moves { font-variant-numeric: tabular-nums; }
  canvas { display: block; border-radius: 16px; box-shadow: 0 20px 50px #0008; }
  #colors { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #colors button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #ffffff33; cursor: pointer; transition: transform .2s cubic-bezier(.34,1.56,.64,1); font: 800 14px system-ui; color: #0007; }
  #colors button:hover { transform: scale(1.12); }
  #colors button.cur { border-color: #fff; transform: scale(.85); opacity: .5; }
  #win { position: fixed; inset: 0; display: grid; place-items: center; background: #000a; text-align: center; font-size: 30px; font-weight: 900; }
  #win[hidden] { display: none; }
  #win small { display: block; font-size: 17px; font-weight: 600; margin: 8px 0 14px; }
  #win button { border: 0; border-radius: 999px; padding: 12px 22px; background: #ffd23f; color: #3a2400; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><button type="button" data-s="10">Small</button><button type="button" data-s="14">Medium</button><button type="button" data-s="18">Large</button><span id="moves">Moves: 0 / 0</span></div>
  <canvas id="c"></canvas>
  <div id="colors"></div>
  <div style="font-size:12px;opacity:.7">Flood from the top-left corner · Keys 1–6 pick colours · N for a new board</div>
</div>
<div id="win" hidden><div id="winIn"></div></div>
<script>
(() => {
  const COLS = ["#ff5d73", "#ffd23f", "#51cf66", "#4dabf7", "#b15cff", "#ff9f1c"];
  const c = document.getElementById("c"), x = c.getContext("2d"), colorsEl = document.getElementById("colors");
  let N = 14, grid, owned, moves, limit, cell, waveAt, t = 0, done = false;
  try { N = +localStorage.getItem("color-flood-size") || 14; } catch (e) {}
  COLS.forEach((col, i) => { const b = document.createElement("button"); b.type = "button"; b.style.background = col; b.textContent = i + 1; b.setAttribute("aria-label", "Colour " + (i + 1)); b.onclick = () => pick(i); colorsEl.appendChild(b); });
  function newGame() {
    document.querySelectorAll("[data-s]").forEach((b) => b.classList.toggle("on", +b.dataset.s === N));
    grid = Array.from({ length: N * N }, () => Math.floor(Math.random() * COLS.length));
    owned = new Set([0]); grow(); moves = 0; limit = Math.round(N * 1.8 + 3); done = false;
    waveAt = new Array(N * N).fill(-1); layout(); hud();
  }
  function grow() {
    const q = [...owned], col = grid[0];
    for (let k = 0; k < q.length; k++) {
      const i = q[k], r = Math.floor(i / N), cc = i % N;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const rr = r + dr, c2 = cc + dc, j = rr * N + c2;
        if (rr >= 0 && rr < N && c2 >= 0 && c2 < N && !owned.has(j) && grid[j] === col) { owned.add(j); q.push(j); }
      }
    }
  }
  function pick(ci) {
    if (done || ci === grid[0]) return;
    moves++;
    owned.forEach((i) => { grid[i] = ci; waveAt[i] = t + (Math.floor(i / N) + i % N) * 0.012; });
    const before = owned.size; grow();
    owned.forEach((i) => { if (waveAt[i] < t - 1) waveAt[i] = t + (Math.floor(i / N) + i % N) * 0.012; });
    hud();
    if (owned.size === N * N) finish(true); else if (moves >= limit) finish(false);
  }
  function finish(win) {
    done = true;
    const key = "color-flood-best-" + N; let b = Infinity; try { b = +localStorage.getItem(key) || Infinity; } catch (e) {}
    if (win && moves < b) try { localStorage.setItem(key, moves); } catch (e) {}
    document.getElementById("winIn").innerHTML = `${win ? "🌊 Flooded!" : "😮 Out of moves"}<small>${win ? `${moves} moves${moves < b ? " — new best!" : ` · Best: ${b}`}` : `You covered ${Math.round(owned.size / N / N * 100)}% of the board.`}</small><button type="button" id="again">New board</button>`;
    setTimeout(() => { document.getElementById("win").hidden = false; document.getElementById("again").onclick = () => { document.getElementById("win").hidden = true; newGame(); }; }, 700);
  }
  function hud() {
    document.getElementById("moves").textContent = `Moves: ${moves} / ${limit}`;
    [...colorsEl.children].forEach((b, i) => b.classList.toggle("cur", i === grid[0]));
  }
  function layout() { cell = Math.floor(Math.min((innerWidth - 24) / N, (innerHeight - 190) / N, 40)); const d = Math.min(devicePixelRatio || 1, 2); c.style.width = c.style.height = cell * N + "px"; c.width = c.height = cell * N * d; x.setTransform(d, 0, 0, d, 0, 0); }
  function draw() {
    for (let i = 0; i < N * N; i++) {
      const r = Math.floor(i / N), cc = i % N, w = waveAt[i] >= 0 ? Math.max(0, 1 - Math.abs(t - waveAt[i]) * 6) : 0;
      x.fillStyle = COLS[grid[i]]; x.fillRect(cc * cell, r * cell, cell, cell);
      if (owned.has(i)) { x.fillStyle = `rgba(255,255,255,${0.12 + w * 0.5})`; x.fillRect(cc * cell, r * cell, cell, cell); }
      x.fillStyle = "#ffffff26"; x.fillRect(cc * cell + 2, r * cell + 2, cell - 4, cell * 0.22);
    }
  }
  let last = 0; function loop(now) { const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; t += dt; draw(); requestAnimationFrame(loop); }
  addEventListener("keydown", (e) => { if (/^[1-6]$/.test(e.key)) pick(+e.key - 1); if (e.key.toLowerCase() === "n") { document.getElementById("win").hidden = true; newGame(); } });
  document.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => { N = +b.dataset.s; try { localStorage.setItem("color-flood-size", N); } catch (e) {} newGame(); }));
  addEventListener("resize", layout);
  newGame(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
