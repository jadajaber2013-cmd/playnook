<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Balloon Pop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a5d8ff; color: #1c1638; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #ffffffaa; font-size: 36px; font-weight: 900; padding: 20px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 18px; font-weight: 700; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🎈 Balloon Pop<small>Pop the balloons that match the colour at the top!<br>Tap or click them. Keyboard: Tab picks, Space pops.<br>Tap or press Space to start</small></div></div>
<script>
(() => {
  const COLS = [["red", "#ff4f6d"], ["blue", "#4dabf7"], ["green", "#51cf66"], ["yellow", "#ffd23f"], ["purple", "#b15cff"], ["orange", "#ff9f1c"], ["pink", "#ff8fc7"]];
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, U, balloons, bits, target, pops, stars, level, state = "menu", last = 0, spawnT = 0, sel = -1, t = 0, clouds, wobble = 0;
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; U = Math.min(W, H) / 500; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", resize); resize();
  clouds = Array.from({ length: 6 }, () => ({ x: Math.random(), y: 0.15 + Math.random() * 0.6, s: 0.6 + Math.random() * 0.8, v: 0.01 + Math.random() * 0.02 }));
  function say(text) { try { if (speechSynthesis && !speechSynthesis.speaking) { const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; u.pitch = 1.3; speechSynthesis.speak(u); } } catch (e) {} }
  let audio; function pop() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.setValueAtTime(700 + Math.random() * 300, audio.currentTime); o.frequency.exponentialRampToValueAtTime(120, audio.currentTime + 0.12); g.gain.setValueAtTime(0.2, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.15); } catch (e) {} }
  function pickTarget() { let n; do { n = Math.floor(Math.random() * Math.min(COLS.length, 3 + level)); } while (target && n === target && level > 0); target = n; wobble = 1; say("Pop the " + COLS[n][0] + " balloons!"); }
  function start() { balloons = []; bits = []; pops = 0; stars = 0; level = 0; target = null; pickTarget(); state = "play"; msg.hidden = true; }
  function spawn() {
    const n = Math.min(COLS.length, 3 + level), ci = Math.random() < 0.4 ? target : Math.floor(Math.random() * n);
    balloons.push({ x: 40 * U + Math.random() * (W - 80 * U), y: H + 60 * U, r: (34 + Math.random() * 12) * U, ci, v: (60 + Math.random() * 40 + level * 8) * U, ph: Math.random() * 6 });
  }
  function popAt(i) {
    const b = balloons[i]; if (!b) return;
    pop(); balloons.splice(i, 1); sel = Math.min(sel, balloons.length - 1);
    for (let k = 0; k < 14; k++) { const a = Math.random() * 7, s = (80 + Math.random() * 200) * U; bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col: COLS[b.ci][1], l: 0.7, txt: null }); }
    if (b.ci === target) {
      pops++; bits.push({ x: b.x, y: b.y, vx: 0, vy: -60 * U, l: 1, txt: "⭐" });
      if (pops % 10 === 0) { stars++; level++; bits.push({ x: W / 2, y: H / 2, vx: 0, vy: -30, l: 1.6, txt: "🌟 Great job! 🌟", big: true }); say("Great job!"); setTimeout(pickTarget, 900); }
    } else bits.push({ x: b.x, y: b.y, vx: 0, vy: -60 * U, l: 0.8, txt: "Oops!" });
  }
  function update(dt) {
    t += dt; wobble = Math.max(0, wobble - dt);
    spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(0.45, 1.1 - level * 0.08); }
    for (const b of balloons) { b.y -= b.v * dt; b.x += Math.sin(t * 1.5 + b.ph) * 20 * U * dt; }
    balloons = balloons.filter((b) => b.y > -b.r * 3);
    for (const cl of clouds) { cl.x += cl.v * dt; if (cl.x > 1.2) cl.x = -0.2; }
  }
  function drawBalloon(b, focus) {
    const [, col] = COLS[b.ci], r = b.r;
    x.strokeStyle = "#ffffffaa"; x.lineWidth = 1.5; x.beginPath(); x.moveTo(b.x, b.y + r * 1.15); x.quadraticCurveTo(b.x + Math.sin(t * 3 + b.ph) * 10, b.y + r * 1.8, b.x, b.y + r * 2.4); x.stroke();
    x.fillStyle = col; x.beginPath(); x.ellipse(b.x, b.y, r * 0.86, r, 0, 0, 7); x.fill();
    x.beginPath(); x.moveTo(b.x - 6 * U, b.y + r * 1.12); x.lineTo(b.x + 6 * U, b.y + r * 1.12); x.lineTo(b.x, b.y + r * 0.96); x.fill();
    x.fillStyle = "#ffffff77"; x.beginPath(); x.ellipse(b.x - r * 0.3, b.y - r * 0.38, r * 0.16, r * 0.28, -0.5, 0, 7); x.fill();
    if (focus) { x.strokeStyle = "#1c1638"; x.lineWidth = 4; x.setLineDash([6, 6]); x.beginPath(); x.ellipse(b.x, b.y, r + 6, r * 1.15 + 6, 0, 0, 7); x.stroke(); x.setLineDash([]); }
  }
  function draw(dt) {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#74c0fc"); g.addColorStop(1, "#e7f5ff"); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "#fff7c2"; x.beginPath(); x.arc(W - 60 * U, 70 * U, 34 * U, 0, 7); x.fill();
    for (const cl of clouds) { const cx = cl.x * W, cy = cl.y * H, s = cl.s * 30 * U; x.fillStyle = "#ffffffcc"; x.beginPath(); x.arc(cx, cy, s, 0, 7); x.arc(cx + s, cy - s * 0.4, s * 1.2, 0, 7); x.arc(cx + s * 2.1, cy, s * 0.9, 0, 7); x.fill(); }
    x.fillStyle = "#8ce99a"; x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W; i += 30) x.lineTo(i, H - 40 * U - Math.sin(i / 90) * 14 * U); x.lineTo(W, H); x.fill();
    if (balloons) balloons.forEach((b, i) => drawBalloon(b, i === sel));
    if (bits) { for (const p of bits) { p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (!p.txt) p.vy += 400 * U * dt; x.globalAlpha = Math.max(0, Math.min(1, p.l * 2)); if (p.txt) { x.font = `900 ${(p.big ? 44 : 26) * U}px system-ui`; x.textAlign = "center"; x.fillStyle = "#1c1638"; x.fillText(p.txt, p.x, p.y); } else { x.fillStyle = p.col; x.fillRect(p.x, p.y, 6 * U, 6 * U); } } x.globalAlpha = 1; bits = bits.filter((p) => p.l > 0); }
    if (target !== null && state !== "menu") {
      const s = 1 + Math.sin(wobble * 12) * 0.12 * wobble;
      x.save(); x.translate(W / 2, 46 * U); x.scale(s, s);
      x.fillStyle = "#fff"; x.beginPath(); x.roundRect(-150 * U, -32 * U, 300 * U, 64 * U, 32 * U); x.fill();
      x.fillStyle = COLS[target][1]; x.beginPath(); x.ellipse(-110 * U, 0, 18 * U, 22 * U, 0, 0, 7); x.fill();
      x.fillStyle = "#1c1638"; x.font = `900 ${24 * U}px system-ui`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(`Pop ${COLS[target][0].toUpperCase()}!`, 20 * U, 2 * U);
      x.restore(); x.textBaseline = "alphabetic";
      x.font = `800 ${18 * U}px system-ui`; x.fillStyle = "#1c1638"; x.textAlign = "left"; x.fillText(`🎈 ${pops}   🌟 ${stars}`, 14, H - 16);
      x.fillStyle = "#ffffff88"; x.fillRect(W / 2 - 80 * U, 84 * U, 160 * U, 8 * U); x.fillStyle = COLS[target][1]; x.fillRect(W / 2 - 80 * U, 84 * U, 160 * U * (pops % 10) / 10, 8 * U);
    }
  }
  function loop(now) { const dt = Math.min(0.04, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt); draw(dt); requestAnimationFrame(loop); }
  addEventListener("pointerdown", (e) => {
    if (state !== "play") return start();
    for (let i = balloons.length - 1; i >= 0; i--) { const b = balloons[i]; if (Math.hypot((e.clientX - b.x) / 0.86, e.clientY - b.y) < b.r * 1.15) return popAt(i); }
  });
  addEventListener("keydown", (e) => {
    if (state !== "play") { if (e.key === " " || e.key === "Enter") { e.preventDefault(); start(); } return; }
    if (e.key === "Tab" || e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); if (!balloons.length) return; const order = balloons.map((b, i) => i).sort((a, b) => balloons[a].x - balloons[b].x); const pos = order.indexOf(sel); sel = order[(pos + (e.shiftKey || e.key === "ArrowLeft" ? -1 : 1) + order.length) % order.length]; }
    if ((e.key === " " || e.key === "Enter") && sel >= 0) { e.preventDefault(); popAt(sel); }
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
