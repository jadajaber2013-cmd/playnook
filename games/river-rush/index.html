<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>River Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2f9e44; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #0007; font-size: 34px; font-weight: 900; padding: 20px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🛶 River Rush<small>Steer with ← → / A D, or hold the left/right side of the screen.<br>Dodge rocks and logs, grab 💎 gems.<br>Press Space or tap to start</small></div></div>
<script>
(() => {
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, U, boat, obs, gems, ripples, dist, speed, score, hearts, state = "menu", last = 0, keys = {}, touchDir = 0, scroll = 0, spawnT = 0, inv = 0, best = 0, t = 0;
  try { best = +localStorage.getItem("river-rush-best") || 0; } catch (e) {}
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; U = Math.min(W, H * 0.8) / 420; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", resize); resize();
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  // river centre and half-width at a given world distance
  const riverAt = (wy) => ({ cx: W / 2 + Math.sin(wy / 900) * W * 0.12 + Math.sin(wy / 340) * W * 0.05, hw: Math.max(140 * U, Math.min(W * 0.42, 230 * U + Math.sin(wy / 500) * 50 * U)) });
  function start() { boat = { x: W / 2, vx: 0 }; obs = []; gems = []; ripples = []; dist = 0; speed = 260; score = 0; hearts = 3; inv = 1; state = "play"; msg.hidden = true; }
  function update(dt) {
    t += dt; speed = Math.min(620, speed + dt * 6); dist += speed * dt; scroll += speed * dt; inv -= dt;
    const dir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0) || touchDir;
    boat.vx += dir * 1600 * U * dt; boat.vx *= Math.pow(0.04, dt);
    // world distance wy is drawn at screen y = by - (wy - dist); the boat sits at y = by
    const by = H * 0.75;
    boat.x += boat.vx * dt;
    const rv = riverAt(dist), lim = rv.hw - 22 * U;
    if (Math.abs(boat.x - rv.cx) > lim) { boat.x = rv.cx + Math.sign(boat.x - rv.cx) * lim; boat.vx *= -0.5; hit(); }
    spawnT -= dt;
    if (spawnT <= 0) {
      const rr = riverAt(dist + by + 60), kind = Math.random() < 0.35 ? "log" : "rock";
      obs.push({ wy: dist + by + 60, x: rr.cx + (Math.random() - 0.5) * rr.hw * 1.5, kind, r: kind === "rock" ? (16 + Math.random() * 14) * U : 18 * U, len: (60 + Math.random() * 50) * U, rot: (Math.random() - 0.5) * 0.6 });
      if (Math.random() < 0.45) gems.push({ wy: dist + by + 130, x: rr.cx + (Math.random() - 0.5) * rr.hw });
      spawnT = Math.max(0.35, 1.0 - dist / 30000) * (300 / speed) * 1.4;
    }
    for (const o of obs) {
      o.sy = by - (o.wy - dist);
      const dx = boat.x - o.x, dy = by - o.sy;
      let hitIt = false;
      if (o.kind === "rock") hitIt = Math.hypot(dx, dy) < o.r + 14 * U;
      else { const ca = Math.cos(o.rot), sa = Math.sin(o.rot), lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca; hitIt = Math.abs(lx) < o.len / 2 + 10 * U && Math.abs(ly) < o.r + 14 * U; }
      if (hitIt && inv <= 0) { hit(); o.hitT = 0.3; }
    }
    obs = obs.filter((o) => o.sy < H + 120);
    for (const g of gems) { g.sy = by - (g.wy - dist); if (!g.got && Math.hypot(boat.x - g.x, by - g.sy) < 30 * U) { g.got = true; score += 50; for (let i = 0; i < 10; i++) { const a = Math.random() * 7; ripples.push({ x: g.x, y: g.sy, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.5, spark: true }); } } }
    gems = gems.filter((g) => !g.got && g.sy < H + 40);
    if (Math.random() < dt * 14) ripples.push({ x: boat.x + (Math.random() - 0.5) * 20 * U, y: by + 30 * U, vx: 0, vy: speed * 0.6, life: 0.6, r: 3 * U });
  }
  function hit() {
    if (inv > 0) return;
    hearts--; inv = 1.5; shake = 12;
    if (hearts <= 0) {
      state = "over"; const s = Math.floor(dist / 50) + score;
      if (s > best) { best = s; try { localStorage.setItem("river-rush-best", best); } catch (e) {} }
      setTimeout(() => show("💦 Capsized!", `Score: ${s} · Best: ${best}<br>Press Space or tap to paddle again`), 500);
    }
  }
  let shake = 0;
  function draw(dt) {
    x.save();
    if (shake > 0) { x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = Math.max(0, shake - dt * 30); }
    x.fillStyle = "#3d9a4a"; x.fillRect(-20, -20, W + 40, H + 40);
    const by = H * 0.75, d0 = state === "menu" ? scroll : dist;
    if (state === "menu") scroll += 120 * dt;
    // banks + water drawn in horizontal strips
    for (let sy = -10; sy < H + 10; sy += 8) {
      const rv = riverAt(d0 + (by - sy));
      x.fillStyle = "#c9a26a"; x.fillRect(rv.cx - rv.hw - 14 * U, sy, rv.hw * 2 + 28 * U, 9);
      x.fillStyle = "#1c7ed6"; x.fillRect(rv.cx - rv.hw, sy, rv.hw * 2, 9);
    }
    x.strokeStyle = "#ffffff30"; x.lineWidth = 2;
    for (let i = 0; i < 26; i++) { const sy = ((i * 61 + d0 * 1) % (H + 40)) - 20, rv = riverAt(d0 + by - sy), px = rv.cx + Math.sin(i * 7.3) * rv.hw * 0.7; x.beginPath(); x.moveTo(px - 14, sy); x.quadraticCurveTo(px, sy - 5, px + 14, sy); x.stroke(); }
    for (let i = 0; i < 22; i++) { const sy = ((i * 97 + d0) % (H + 80)) - 40, rv = riverAt(d0 + by - sy), side = i % 2 ? 1 : -1, px = rv.cx + side * (rv.hw + 50 * U + (i % 3) * 25 * U); x.fillStyle = "#2b8a3e"; x.beginPath(); x.arc(px, sy, 24 * U, 0, 7); x.fill(); x.fillStyle = "#40c057"; x.beginPath(); x.arc(px - 6 * U, sy - 6 * U, 13 * U, 0, 7); x.fill(); }
    if (ripples) { for (const p of ripples) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; x.globalAlpha = Math.max(0, p.life * 1.6); x.fillStyle = p.spark ? "#9be7ff" : "#fff"; x.beginPath(); x.arc(p.x, p.y, p.spark ? 3 : p.r, 0, 7); x.fill(); } x.globalAlpha = 1; ripples = ripples.filter((p) => p.life > 0); }
    if (gems) for (const g of gems) { x.font = `${30 * U}px system-ui`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("💎", g.x, g.sy + Math.sin(t * 5 + g.x) * 3); }
    if (obs) for (const o of obs) {
      x.save(); x.translate(o.x, o.sy);
      x.fillStyle = "#ffffff55"; x.beginPath(); x.ellipse(0, 6 * U, (o.kind === "rock" ? o.r : o.len / 2) + 8 * U, o.r * 0.7, o.kind === "rock" ? 0 : o.rot, 0, 7); x.fill();
      if (o.kind === "rock") { x.fillStyle = "#868e96"; x.beginPath(); x.arc(0, 0, o.r, 0, 7); x.fill(); x.fillStyle = "#adb5bd"; x.beginPath(); x.arc(-o.r * 0.3, -o.r * 0.3, o.r * 0.45, 0, 7); x.fill(); }
      else { x.rotate(o.rot); x.fillStyle = "#8b5a2b"; x.beginPath(); x.roundRect(-o.len / 2, -o.r * 0.8, o.len, o.r * 1.6, o.r * 0.8); x.fill(); x.fillStyle = "#c08a50"; x.beginPath(); x.ellipse(o.len / 2 - 4 * U, 0, 6 * U, o.r * 0.7, 0, 0, 7); x.fill(); x.strokeStyle = "#6b4420"; x.lineWidth = 2; x.beginPath(); x.moveTo(-o.len / 3, -3); x.lineTo(o.len / 4, -3); x.stroke(); }
      x.restore();
    }
    if (boat && (inv <= 0 || Math.floor(inv * 10) % 2)) {
      x.save(); x.translate(boat.x, by); x.rotate(boat.vx / (2000 * U));
      x.fillStyle = "#e8590c"; x.beginPath(); x.moveTo(0, -36 * U); x.quadraticCurveTo(16 * U, -10 * U, 12 * U, 28 * U); x.lineTo(-12 * U, 28 * U); x.quadraticCurveTo(-16 * U, -10 * U, 0, -36 * U); x.fill();
      x.fillStyle = "#ffa94d"; x.beginPath(); x.ellipse(0, 0, 7 * U, 20 * U, 0, 0, 7); x.fill();
      x.fillStyle = "#ffd8a8"; x.beginPath(); x.arc(0, -2 * U, 7 * U, 0, 7); x.fill();
      x.fillStyle = "#e03131"; x.beginPath(); x.arc(0, -5 * U, 7 * U, Math.PI, 0); x.fill();
      const pa = Math.sin(t * 9) * 0.7; x.strokeStyle = "#5c3d1e"; x.lineWidth = 3 * U; x.beginPath(); x.moveTo(-24 * U * Math.cos(pa), -2 * U - 14 * U * Math.sin(pa)); x.lineTo(24 * U * Math.cos(pa), -2 * U + 14 * U * Math.sin(pa)); x.stroke();
      x.restore();
    }
    x.restore();
    if (boat && state !== "menu") {
      x.fillStyle = "#0007"; x.beginPath(); x.roundRect(10, 10, 190, 50, 14); x.fill();
      x.fillStyle = "#fff"; x.font = "900 20px system-ui"; x.textAlign = "left"; x.textBaseline = "alphabetic"; x.fillText(`${Math.floor(dist / 50) + score}  ${"❤️".repeat(Math.max(0, hearts))}`, 22, 42);
    }
  }
  function loop(now) { const dt = Math.min(0.04, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt); else t += dt; draw(dt); requestAnimationFrame(loop); }
  const MAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (MAP[k]) { keys[MAP[k]] = true; e.preventDefault(); }
    if (k === " " || k === "enter") { e.preventDefault(); if (state === "menu" || (state === "over" && !msg.hidden)) start(); else if (state === "paused") { state = "play"; msg.hidden = true; } }
    if ((k === "p" || k === "escape") && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); }
  });
  addEventListener("keyup", (e) => { const k = MAP[e.key.toLowerCase()]; if (k) keys[k] = false; });
  addEventListener("pointerdown", (e) => { if (state === "menu" || (state === "over" && !msg.hidden)) return start(); if (state === "paused") { state = "play"; msg.hidden = true; return; } touchDir = e.clientX < W / 2 ? -1 : 1; });
  addEventListener("pointermove", (e) => { if (touchDir && e.buttons) touchDir = e.clientX < W / 2 ? -1 : 1; });
  addEventListener("pointerup", () => (touchDir = 0)); addEventListener("pointercancel", () => (touchDir = 0));
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); } });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
