<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Trail Blazer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050414; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #hud { display: flex; gap: 12px; font-weight: 800; font-size: 15px; }
  #hud span { padding: 4px 12px; border-radius: 999px; background: #ffffff14; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 40px #00e5ff33; }
  #pad { display: none; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 52px); gap: 6px; }
  #pad button { border: 0; border-radius: 14px; background: #ffffff1c; color: #fff; font-size: 22px; touch-action: none; }
  #pad button:active { background: #00e5ff55; }
  @media (pointer: coarse) { #pad { display: grid; } }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #000a; font-size: 32px; font-weight: 900; padding: 20px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span style="color:#00e5ff">You: <b id="w0">0</b></span><span style="color:#ff4fa3">Pink: <b id="w1">0</b></span><span style="color:#ffd23f">Gold: <b id="w2">0</b></span></div>
  <canvas id="c"></canvas>
  <div id="pad" aria-hidden="true"><span></span><button data-d="0">▲</button><span></span><button data-d="3">◀</button><button data-d="2">▼</button><button data-d="1">▶</button></div>
</div>
<div id="msg"><div>⚡ Trail Blazer<small>Steer with the arrow keys / WASD, swipe, or the on-screen arrows.<br>Don't hit walls or trails. Be the last bike riding!<br>Press Space or tap to start</small></div></div>
<script>
(() => {
  const GW = 64, GH = 44, DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]], COLS = ["#00e5ff", "#ff4fa3", "#ffd23f"];
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg"), pad = document.getElementById("pad");
  let cell, grid, bikes, state = "menu", acc = 0, last = 0, wins = [0, 0, 0], sparks = [], round = 0, countdown = 0;
  try { wins = JSON.parse(localStorage.getItem("trail-blazer-wins")) || wins; } catch (e) {}
  function resize() {
    const padH = getComputedStyle(pad).display === "none" ? 0 : 124;
    cell = Math.max(4, Math.floor(Math.min((innerWidth - 16) / GW, (innerHeight - 60 - padH) / GH)));
    const d = Math.min(devicePixelRatio || 1, 2);
    c.style.width = GW * cell + "px"; c.style.height = GH * cell + "px"; c.width = GW * cell * d; c.height = GH * cell * d; x.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", resize); resize();
  const hud = () => wins.forEach((w, i) => (document.getElementById("w" + i).textContent = w));
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  const free = (gx, gy) => gx >= 0 && gy >= 0 && gx < GW && gy < GH && !grid[gy * GW + gx];

  function start() {
    grid = new Uint8Array(GW * GH);
    bikes = [
      { x: 8, y: GH / 2, d: 1, alive: true, q: [] },
      { x: GW - 9, y: Math.floor(GH / 3), d: 3, alive: true, ai: true },
      { x: GW - 9, y: Math.floor(GH * 2 / 3), d: 3, alive: true, ai: true }
    ];
    bikes.forEach((b, i) => (grid[b.y * GW + b.x] = i + 1));
    sparks = []; acc = 0; countdown = 1.5; round++; state = "play"; msg.hidden = true; hud();
  }

  function space(sx, sy, limit) { // how much room is reachable from here (capped)
    if (!free(sx, sy)) return 0;
    const seen = new Set([sy * GW + sx]), q = [[sx, sy]];
    for (let i = 0; i < q.length && seen.size < limit; i++) for (const [dx, dy] of DIRS) { const nx = q[i][0] + dx, ny = q[i][1] + dy, k = ny * GW + nx; if (free(nx, ny) && !seen.has(k)) { seen.add(k); q.push([nx, ny]); } }
    return seen.size;
  }
  function think(b) {
    const opts = [b.d, (b.d + 1) % 4, (b.d + 3) % 4].map((d) => ({ d, s: space(b.x + DIRS[d][0], b.y + DIRS[d][1], 300) + (d === b.d ? 8 : 0) + Math.random() * 6 }));
    // sometimes cut toward the player
    const p = bikes[0];
    if (p.alive && Math.random() < 0.15) opts.forEach((o) => { const nx = b.x + DIRS[o.d][0] * 6, ny = b.y + DIRS[o.d][1] * 6; o.s -= Math.hypot(nx - p.x, ny - p.y) * 0.4; });
    opts.sort((a, b2) => b2.s - a.s);
    b.d = opts[0].d;
  }
  function tick() {
    const me = bikes[0];
    if (me.q.length) { const nd = me.q.shift(); if ((nd + 2) % 4 !== me.d) me.d = nd; }
    bikes.forEach((b) => { if (b.alive && b.ai) think(b); });
    const moves = bikes.map((b) => (b.alive ? [b.x + DIRS[b.d][0], b.y + DIRS[b.d][1]] : null));
    bikes.forEach((b, i) => {
      if (!b.alive) return;
      const [nx, ny] = moves[i], headOn = moves.some((m, j) => j !== i && m && bikes[j].alive && m[0] === nx && m[1] === ny);
      if (!free(nx, ny) || headOn) { b.alive = false; boom(b.x, b.y, COLS[i]); }
    });
    bikes.forEach((b, i) => { if (b.alive) { b.x = moves[i][0]; b.y = moves[i][1]; grid[b.y * GW + b.x] = i + 1; } });
    const alive = bikes.filter((b) => b.alive);
    if (!me.alive || alive.length <= 1) {
      state = "over";
      const winner = alive.length === 1 ? bikes.indexOf(alive[0]) : -1;
      if (winner >= 0) wins[winner]++;
      try { localStorage.setItem("trail-blazer-wins", JSON.stringify(wins)); } catch (e) {}
      hud();
      setTimeout(() => show(winner === 0 ? "🏆 You win the round!" : winner > 0 ? (winner === 1 ? "💗 Pink" : "💛 Gold") + " wins" : "💥 Crash!", "Press Space or tap for the next round"), 700);
    }
  }
  function boom(gx, gy, col) { for (let i = 0; i < 30; i++) { const a = Math.random() * 7, s = 3 + Math.random() * 10; sparks.push({ x: gx + 0.5, y: gy + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.8, col }); } }

  function draw(dt) {
    x.fillStyle = "#07061c"; x.fillRect(0, 0, GW * cell, GH * cell);
    x.strokeStyle = "#ffffff0d"; x.lineWidth = 1; x.beginPath();
    for (let i = 0; i <= GW; i += 4) { x.moveTo(i * cell, 0); x.lineTo(i * cell, GH * cell); }
    for (let i = 0; i <= GH; i += 4) { x.moveTo(0, i * cell); x.lineTo(GW * cell, i * cell); }
    x.stroke();
    if (!grid) return;
    for (let i = 0; i < grid.length; i++) if (grid[i]) {
      const col = COLS[grid[i] - 1], gx = i % GW, gy = Math.floor(i / GW);
      x.fillStyle = col; x.globalAlpha = bikes[grid[i] - 1].alive ? 0.85 : 0.3; x.fillRect(gx * cell + 1, gy * cell + 1, cell - 2, cell - 2);
    }
    x.globalAlpha = 1;
    bikes.forEach((b, i) => { if (!b.alive) return; x.shadowBlur = 16; x.shadowColor = COLS[i]; x.fillStyle = "#fff"; x.fillRect(b.x * cell - 1, b.y * cell - 1, cell + 2, cell + 2); x.shadowBlur = 0; });
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; x.globalAlpha = Math.max(0, s.life); x.fillStyle = s.col; x.fillRect(s.x * cell, s.y * cell, cell * 0.6, cell * 0.6); }
    x.globalAlpha = 1; sparks = sparks.filter((s) => s.life > 0);
    if (countdown > 0 && state === "play") { x.fillStyle = "#fff"; x.font = `900 ${cell * 8}px system-ui`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(Math.ceil(countdown * 2) > 1 ? "Ready" : "GO!", GW * cell / 2, GH * cell / 2); }
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    if (state === "play") {
      if (countdown > 0) countdown -= dt;
      else { acc += dt; const step = 0.065; while (acc >= step && state === "play") { acc -= step; tick(); } }
    }
    draw(dt); requestAnimationFrame(loop);
  }
  function turn(d) { if (state === "play" && bikes[0].q.length < 3) bikes[0].q.push(d); }
  const KM = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 };
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k in KM) { e.preventDefault(); turn(KM[k]); }
    if (k === " " || k === "enter") { e.preventDefault(); if (state === "paused") { state = "play"; msg.hidden = true; } else if (state !== "play" && (state === "menu" || !msg.hidden)) start(); }
    if ((k === "p" || k === "escape") && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); }
  });
  let sx = null, sy = null;
  c.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
  addEventListener("pointermove", (e) => {
    if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) { turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); sx = e.clientX; sy = e.clientY; }
  });
  addEventListener("pointerup", () => { sx = sy = null; });
  pad.querySelectorAll("button").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); turn(+b.dataset.d); }));
  msg.addEventListener("pointerdown", () => { if (state === "paused") { state = "play"; msg.hidden = true; } else start(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); } });
  hud(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
