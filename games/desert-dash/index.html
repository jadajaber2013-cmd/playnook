<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Desert Dash</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9a0; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #5a2a0055; font-size: 34px; font-weight: 900; padding: 20px; text-shadow: 0 3px 10px #0006; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 17px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🦊 Desert Dash<small>Jump: Space / ↑ / W or tap the top half.<br>Duck: ↓ / S or hold the bottom half.<br>Press Space or tap to run!</small></div></div>
<script>
(() => {
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, U, ground, fox, obs, dust, dist, speed, state = "menu", last = 0, t = 0, spawnD = 0, duckHeld = false, best = 0, shake = 0, day = 0;
  try { best = +localStorage.getItem("desert-dash-best") || 0; } catch (e) {}
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; U = Math.min(H / 400, W / 500); ground = H * 0.72; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", resize); resize();
  function start() { fox = { y: 0, vy: 0, duck: false }; obs = []; dust = []; dist = 0; speed = 330; spawnD = 400; state = "play"; msg.hidden = true; }
  function jump() { if (fox.y === 0) { fox.vy = -720; for (let i = 0; i < 6; i++) dust.push({ x: W * 0.18, y: ground, vx: -40 - Math.random() * 80, vy: -Math.random() * 60, life: 0.5 }); } }
  function over() {
    state = "over"; shake = 12;
    const s = Math.floor(dist / 10);
    if (s > best) { best = s; try { localStorage.setItem("desert-dash-best", best); } catch (e) {} }
    setTimeout(() => show("🌵 Ouch!", `Distance: ${s} m · Best: ${best} m<br>Press Space or tap to run again`), 450);
  }

  function update(dt) {
    t += dt; speed = Math.min(780, speed + dt * 9); dist += speed * dt / 10 * 1;
    fox.duck = duckHeld && fox.y === 0;
    fox.vy += 2300 * dt; fox.y = Math.min(0, fox.y + fox.vy * dt); if (fox.y === 0) fox.vy = 0;
    if (fox.y < 0 && duckHeld) fox.vy += 3000 * dt; // fast fall
    spawnD -= speed * dt;
    if (spawnD <= 0) {
      const bird = dist > 60 && Math.random() < 0.3;
      if (bird) obs.push({ x: W / U + 40, kind: "bird", y: Math.random() < 0.5 ? 58 : 30, w: 42, h: 26 });
      else { const n = 1 + (Math.random() < Math.min(0.5, dist / 1500) ? 1 : 0) + (dist > 900 && Math.random() < 0.2 ? 1 : 0), big = Math.random() < 0.4; for (let i = 0; i < n; i++) obs.push({ x: W / U + 40 + i * 26, kind: "cactus", w: big ? 26 : 20, h: big ? 60 : 44 }); }
      spawnD = 320 + Math.random() * 380 + speed * 0.35;
    }
    const fx = W * 0.18 / U, fw = fox.duck ? 46 : 34, fh = fox.duck ? 22 : 40, fy = fox.y;
    for (const o of obs) {
      o.x -= speed * dt;
      const ox = o.x, oy = o.kind === "bird" ? -o.y - o.h : -o.h;
      if (fx + fw / 2 - 6 > ox && fx - fw / 2 + 6 < ox + o.w && fy - fh + 6 < oy + o.h && fy - 4 > oy) return over();
    }
    obs = obs.filter((o) => o.x > -80);
    if (fox.y === 0 && Math.random() < dt * 20) dust.push({ x: W * 0.18 - 14 * U, y: ground, vx: -speed * 0.3 * U, vy: -Math.random() * 40, life: 0.4 });
  }

  function cactus(px, w, h) {
    x.fillStyle = "#2f9e44"; x.beginPath(); x.roundRect(px, -h, w, h, w / 2); x.fill();
    x.beginPath(); x.roundRect(px - w * 0.45, -h * 0.65, w * 0.4, h * 0.3, 5); x.fill(); x.beginPath(); x.roundRect(px - w * 0.45, -h * 0.85, w * 0.32, h * 0.28, 5); x.fill();
    x.beginPath(); x.roundRect(px + w * 1.05, -h * 0.75, w * 0.4, h * 0.25, 5); x.fill(); x.beginPath(); x.roundRect(px + w * 1.13, -h * 0.95, w * 0.32, h * 0.3, 5); x.fill();
    x.fillStyle = "#40c057"; x.fillRect(px + w * 0.25, -h + 6, w * 0.15, h - 10);
  }

  function draw(dt) {
    x.save();
    if (shake > 0) { x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = Math.max(0, shake - dt * 30); }
    day = (dist / 3000) % 1;
    const night = Math.max(0, Math.sin(day * Math.PI * 2 - 1.2));
    const sky = x.createLinearGradient(0, 0, 0, ground);
    sky.addColorStop(0, night > 0.3 ? "#2b2a6b" : "#ff9a5a"); sky.addColorStop(1, night > 0.3 ? "#b56aa6" : "#ffe2a8");
    x.fillStyle = sky; x.fillRect(-20, -20, W + 40, H + 40);
    x.fillStyle = night > 0.3 ? "#fff6d6" : "#fff2b0"; x.beginPath(); x.arc(W * 0.78, ground * 0.32, 46 * U, 0, 7); x.fill();
    const scroll = dist * 10;
    for (let layer = 0; layer < 2; layer++) {
      x.fillStyle = layer ? "#e8a868" : "#f2c48d";
      const sp = layer ? 0.4 : 0.15, amp = layer ? 30 : 55;
      x.beginPath(); x.moveTo(0, ground);
      for (let px = 0; px <= W + 30; px += 30) x.lineTo(px, ground - amp * U - Math.sin((px + scroll * sp) / (160 * U)) * amp * 0.6 * U);
      x.lineTo(W, ground); x.fill();
    }
    x.fillStyle = "#f7d08a"; x.fillRect(0, ground, W, H - ground);
    x.fillStyle = "#e6b56a"; for (let i = 0; i < 30; i++) { const px = ((i * 97 - scroll * U) % (W + 40) + W + 40) % (W + 40); x.fillRect(px, ground + 10 * U + (i * 37) % (H - ground - 14 * U), 10 * U, 3 * U); }
    x.save(); x.translate(0, ground); x.scale(U, U);
    if (obs) for (const o of obs) {
      if (o.kind === "cactus") cactus(o.x, o.w, o.h);
      else {
        const fl = Math.sin(t * 14) * 10;
        x.fillStyle = "#6b4ea0"; x.beginPath(); x.ellipse(o.x + 21, -o.y - 13, 18, 10, 0, 0, 7); x.fill();
        x.beginPath(); x.moveTo(o.x + 14, -o.y - 15); x.lineTo(o.x + 26, -o.y - 30 - fl); x.lineTo(o.x + 30, -o.y - 14); x.fill();
        x.fillStyle = "#ff9f1c"; x.beginPath(); x.moveTo(o.x + 2, -o.y - 14); x.lineTo(o.x - 8, -o.y - 11); x.lineTo(o.x + 4, -o.y - 9); x.fill();
        x.fillStyle = "#fff"; x.beginPath(); x.arc(o.x + 9, -o.y - 16, 3, 0, 7); x.fill();
      }
    }
    if (fox) {
      const fx = W * 0.18 / U, fy = fox.y, run = state === "play" && fox.y === 0 ? Math.sin(t * 22) : 0;
      x.save(); x.translate(fx, fy);
      if (fox.duck) x.scale(1.25, 0.6);
      x.fillStyle = "#f76707"; x.beginPath(); x.ellipse(-22, -24, 16, 7, -0.5 + run * 0.2, 0, 7); x.fill();
      x.fillStyle = "#fff"; x.beginPath(); x.ellipse(-34, -30, 6, 4, -0.5, 0, 7); x.fill();
      x.fillStyle = "#e8590c"; x.fillRect(-10 + run * 4, -12, 6, 12); x.fillRect(6 - run * 4, -12, 6, 12);
      x.fillStyle = "#fd7e14"; x.beginPath(); x.ellipse(0, -22, 18, 12, 0, 0, 7); x.fill();
      x.beginPath(); x.ellipse(14, -34, 11, 10, 0, 0, 7); x.fill();
      x.beginPath(); x.moveTo(8, -40); x.lineTo(10, -54); x.lineTo(17, -42); x.fill(); x.beginPath(); x.moveTo(15, -41); x.lineTo(21, -53); x.lineTo(23, -38); x.fill();
      x.fillStyle = "#fff"; x.beginPath(); x.ellipse(20, -30, 7, 5, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(0, -16, 10, 5, 0, 0, 7); x.fill();
      x.fillStyle = "#222"; x.beginPath(); x.arc(17, -36, 2.2, 0, 7); x.fill(); x.beginPath(); x.arc(27, -31, 2.5, 0, 7); x.fill();
      x.restore();
    }
    x.restore();
    if (dust) { for (const p of dust) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; x.globalAlpha = Math.max(0, p.life * 2); x.fillStyle = "#e6b56a"; x.beginPath(); x.arc(p.x, p.y, 4 * U, 0, 7); x.fill(); } x.globalAlpha = 1; dust = dust.filter((p) => p.life > 0); }
    if (state !== "menu") {
      x.fillStyle = "#fff"; x.strokeStyle = "#7a3b0055"; x.lineWidth = 5; x.font = `900 ${24 * Math.max(U, 0.8)}px system-ui`; x.textAlign = "right";
      const s = `${Math.floor(dist / 10)} m   🏆 ${best} m`; x.strokeText(s, W - 16, 38); x.fillText(s, W - 16, 38);
    }
    x.restore();
  }

  function loop(now) { const dt = Math.min(0.04, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt); else t += dt; draw(dt); requestAnimationFrame(loop); }
  function act() { if (state === "menu" || (state === "over" && !msg.hidden)) start(); else if (state === "play") jump(); else if (state === "paused") { state = "play"; msg.hidden = true; } }
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "w", "enter"].includes(k)) { e.preventDefault(); if (!e.repeat) act(); }
    if (k === "arrowdown" || k === "s") { e.preventDefault(); duckHeld = true; }
    if ((k === "p" || k === "escape") && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); }
  });
  addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (k === "arrowdown" || k === "s") duckHeld = false; });
  addEventListener("pointerdown", (e) => { if (state !== "play") return act(); if (e.clientY > H * 0.55) duckHeld = true; else jump(); });
  addEventListener("pointerup", () => { duckHeld = false; });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") { state = "paused"; show("Paused", "Press Space or tap to continue"); } });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
