<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Defender</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030f; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(circle, #0006, #000c); font-size: 30px; font-weight: 900; padding: 20px; }
  #msg[hidden] { display: none; }
  #msg small { display: block; font-size: 16px; font-weight: 500; margin-top: 10px; line-height: 1.55; opacity: .9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div>🛸 Star Defender<small>Move with the arrow keys / WASD, or drag anywhere.<br>Your ship fires by itself. Stop the alien waves!<br><b>Press Space or tap to start</b></small></div></div>
<script>
(() => {
  const c = document.getElementById("c"), x = c.getContext("2d"), msg = document.getElementById("msg");
  let W, H, ship, shots, enemies, bombs, parts, bg, score, lives, wave, state = "menu", keys = {}, drag = null, last = 0, fireT = 0, inv = 0, shake = 0, banner = 0, best = 0;
  try { best = +localStorage.getItem("star-defender-best") || 0; } catch (e) {}
  function resize() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", resize); resize();
  bg = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 2 + 0.3 }));
  const show = (a, b) => { msg.innerHTML = `<div>${a}<small>${b}</small></div>`; msg.hidden = false; };

  function spawnWave() {
    wave++; banner = 1.6;
    const cols = Math.max(3, Math.min(3 + wave, Math.floor(W / 64))), rows = Math.min(2 + Math.floor(wave / 2), 5);
    for (let r = 0; r < rows; r++) for (let i = 0; i < cols; i++)
      enemies.push({ bx: (i + 0.5) * (W / cols), by: 70 + r * 48, x: W / 2, y: -80, hp: r === 0 && wave > 2 ? 2 : 1, ph: Math.random() * 6, hue: (wave * 55 + r * 28) % 360, enter: 1 + i * 0.06 + r * 0.1, flash: 0 });
  }
  function start() { ship = { x: W / 2, y: H - 90, tilt: 0 }; shots = []; enemies = []; bombs = []; parts = []; score = 0; lives = 3; wave = 0; inv = 2; spawnWave(); state = "play"; msg.hidden = true; }
  function pause() { if (state === "play") { state = "paused"; show("Paused", "Press P or tap to continue"); } else if (state === "paused") { state = "play"; msg.hidden = true; } }
  function boom(px, py, col, n = 18) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = 60 + Math.random() * 220; parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, col, r: 1.5 + Math.random() * 2.5 }); } }

  function update(dt) {
    const sp = 420, ox = ship.x;
    if (keys.left) ship.x -= sp * dt; if (keys.right) ship.x += sp * dt;
    if (keys.up) ship.y -= sp * dt; if (keys.down) ship.y += sp * dt;
    ship.x = Math.max(22, Math.min(W - 22, ship.x)); ship.y = Math.max(H * 0.45, Math.min(H - 34, ship.y));
    ship.tilt += ((ship.x - ox) / dt / 900 - ship.tilt) * Math.min(1, dt * 10);
    inv -= dt; shake = Math.max(0, shake - dt * 30); banner -= dt;
    fireT -= dt;
    if (fireT <= 0) { fireT = 0.2; shots.push({ x: ship.x, y: ship.y - 22, vx: 0 }); if (wave >= 3) shots.push({ x: ship.x - 14, y: ship.y - 6, vx: -60 }, { x: ship.x + 14, y: ship.y - 6, vx: 60 }); }
    for (const s of shots) { s.y -= 700 * dt; s.x += s.vx * dt; }
    shots = shots.filter((s) => s.y > -20 && !s.dead);
    const t = performance.now() / 1000;
    for (const e of enemies) {
      e.enter = Math.max(0, e.enter - dt * 0.9); e.flash -= dt;
      const k = Math.min(1, e.enter), tx = e.bx + Math.sin(t * 1.3 + e.ph) * 30, ty = e.by + Math.sin(t * 0.8 + e.ph) * 10;
      e.x = tx + (W / 2 - tx) * k * k; e.y = ty - k * k * (ty + 80);
      if (e.enter <= 0 && Math.random() < dt * (0.06 + wave * 0.025)) bombs.push({ x: e.x, y: e.y + 12, vy: 170 + wave * 14 });
      for (const s of shots) if (!s.dead && Math.abs(s.x - e.x) < 20 && Math.abs(s.y - e.y) < 16) {
        s.dead = true; e.hp--; e.flash = 0.1; boom(s.x, s.y, "#7cf7ff", 4);
        if (e.hp <= 0) { e.dead = true; score += 10 * wave; shake = 6; boom(e.x, e.y, `hsl(${e.hue},90%,65%)`, 24); }
      }
      if (inv <= 0 && Math.abs(e.x - ship.x) < 28 && Math.abs(e.y - ship.y) < 26) hit();
    }
    enemies = enemies.filter((e) => !e.dead);
    for (const b of bombs) { b.y += b.vy * dt; if (inv <= 0 && Math.abs(b.x - ship.x) < 14 && Math.abs(b.y - ship.y) < 18) { b.y = H + 99; hit(); } }
    bombs = bombs.filter((b) => b.y < H + 20);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
    parts = parts.filter((p) => p.life > 0);
    if (!enemies.length) spawnWave();
  }
  function hit() {
    lives--; inv = 2; shake = 16; boom(ship.x, ship.y, "#ff9f1c", 40);
    if (lives <= 0) {
      state = "over";
      if (score > best) { best = score; try { localStorage.setItem("star-defender-best", best); } catch (e) {} }
      setTimeout(() => show("💥 Game over", `Score: ${score} · Wave ${wave} · Best: ${best}<br><b>Press Space or tap to play again</b>`), 600);
    }
  }

  function draw() {
    x.save();
    if (shake) x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0b0626"); g.addColorStop(1, "#05030f");
    x.fillStyle = g; x.fillRect(-20, -20, W + 40, H + 40);
    for (const s of bg) { s.y += s.s * (state === "play" ? 0.0016 : 0.0005); if (s.y > 1) s.y = 0; x.fillStyle = `rgba(200,210,255,${0.25 + s.s / 3})`; x.fillRect(s.x * W, s.y * H, s.s, s.s * 2.5); }
    if (ship) {
      x.shadowBlur = 12; x.shadowColor = "#7cf7ff"; x.fillStyle = "#bffbff";
      for (const s of shots) { x.beginPath(); x.roundRect(s.x - 2, s.y - 9, 4, 16, 2); x.fill(); }
      x.shadowColor = "#ff5d73"; x.fillStyle = "#ff8a9a";
      for (const b of bombs) { x.beginPath(); x.arc(b.x, b.y, 5, 0, 7); x.fill(); }
      x.shadowBlur = 0;
      for (const e of enemies) {
        x.save(); x.translate(e.x, e.y); x.rotate(Math.sin(performance.now() / 300 + e.ph) * 0.12);
        x.fillStyle = e.flash > 0 ? "#fff" : `hsl(${e.hue},85%,${e.hp > 1 ? 48 : 62}%)`;
        x.beginPath(); x.ellipse(0, 0, 22, 12, 0, 0, 7); x.fill();
        x.fillStyle = "#ffffffcc"; x.beginPath(); x.ellipse(0, -6, 10, 9, 0, Math.PI, 0); x.fill();
        x.fillStyle = "#111"; x.beginPath(); x.arc(-4, -5, 2, 0, 7); x.arc(4, -5, 2, 0, 7); x.fill();
        x.fillStyle = `hsl(${e.hue},100%,80%)`; for (let i = -1; i <= 1; i++) { x.beginPath(); x.arc(i * 11, 5, 2.5, 0, 7); x.fill(); }
        x.restore();
      }
      for (const p of parts) { x.globalAlpha = Math.max(0, p.life / 0.8); x.fillStyle = p.col; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }
      x.globalAlpha = 1;
      if (state !== "over" && (inv <= 0 || Math.floor(inv * 12) % 2)) {
        x.save(); x.translate(ship.x, ship.y); x.rotate(Math.max(-0.4, Math.min(0.4, ship.tilt)));
        x.fillStyle = "#ff9f1c"; x.beginPath(); x.moveTo(-5, 12); x.lineTo(0, 24 + Math.random() * 12); x.lineTo(5, 12); x.fill();
        x.fillStyle = "#e8ecff"; x.beginPath(); x.moveTo(0, -24); x.lineTo(20, 16); x.lineTo(0, 8); x.lineTo(-20, 16); x.closePath(); x.fill();
        x.fillStyle = "#7c5cff"; x.beginPath(); x.moveTo(0, -24); x.lineTo(7, 4); x.lineTo(-7, 4); x.fill();
        x.fillStyle = "#7cf7ff"; x.beginPath(); x.arc(0, -4, 4.5, 0, 7); x.fill();
        x.restore();
      }
      x.fillStyle = "#fff"; x.font = "800 18px system-ui"; x.textAlign = "left"; x.fillText(`Score ${score}`, 14, 30);
      x.textAlign = "center"; x.fillText(`Wave ${wave}`, W / 2, 30); x.textAlign = "right"; x.fillText("❤️".repeat(Math.max(0, lives)), W - 14, 30);
      if (banner > 0 && state === "play") { x.globalAlpha = Math.min(1, banner); x.textAlign = "center"; x.font = "900 44px system-ui"; x.fillText(`WAVE ${wave}`, W / 2, H / 2); x.globalAlpha = 1; }
    }
    x.restore();
  }
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; if (state === "play") update(dt);
    else if (state === "over") { for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; } parts = parts.filter((p) => p.life > 0); shake = Math.max(0, shake - dt * 30); }
    draw(); requestAnimationFrame(loop); }

  const MAP = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (MAP[k]) { keys[MAP[k]] = true; e.preventDefault(); }
    if (k === " " || k === "enter") { e.preventDefault(); if (state === "menu" || (state === "over" && !msg.hidden)) start(); else if (state === "paused") pause(); }
    if (k === "p" || k === "escape") pause();
  });
  addEventListener("keyup", (e) => { const k = MAP[e.key.toLowerCase()]; if (k) keys[k] = false; });
  addEventListener("pointerdown", (e) => {
    if (state === "menu" || (state === "over" && !msg.hidden)) return start();
    if (state === "paused") return pause();
    if (state === "play") drag = { px: e.clientX, py: e.clientY, sx: ship.x, sy: ship.y };
  });
  addEventListener("pointermove", (e) => { if (drag && state === "play") { ship.x = drag.sx + (e.clientX - drag.px) * 1.3; ship.y = drag.sy + (e.clientY - drag.py) * 1.3; } });
  addEventListener("pointerup", () => { drag = null; });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pause(); });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
